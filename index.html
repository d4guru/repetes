<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Répètes">
<title>Répètes</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1/Sortable.min.js"></script>
<style>
:root{
  --bg:#121214; --surface:#1c1c21; --surface2:#26262d; --border:#34343d;
  --text:#f2f2f4; --muted:#a6a6b0; --accent:#e8643a; --accent-text:#fff;
  --yes:#3fb96b; --maybe:#e3b341; --no:#e5534b;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
header.top{position:sticky;top:0;z-index:5;background:rgba(18,18,20,.94);backdrop-filter:blur(8px);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{margin:0;font-size:20px;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top .me{font-size:14px;color:var(--muted);white-space:nowrap}
.bell{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;margin:-6px -8px -6px 0;border-radius:50%;color:var(--text)}
.bell svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.bell.on{color:var(--accent)}
.bell-count{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;
  font-size:11px;font-weight:700;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--bg)}
.notif-list{padding:4px 0}
.notif{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}
.notif:last-child{border-bottom:0}
.notif.unread{background:rgba(232,100,58,.07)}
.notif-ico{flex:none;width:34px;height:34px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.notif.unread .notif-ico{color:var(--accent)}
.notif-ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.notif-title{display:block;font-weight:650;font-size:15px}
.notif-body{display:block;color:var(--muted);font-size:14px;line-height:1.4;margin-top:2px;overflow-wrap:anywhere}
.notif.unread .notif-body{color:#cfcfd6}
.notif-time{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.notif-dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px}
.switch-row{display:flex;align-items:center;gap:12px;color:var(--text);font-size:15px;margin:0;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.switch-row:last-child{border-bottom:0}
input.switch{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;padding:0;margin:0;border-radius:14px;border:0;background:var(--border);position:relative;cursor:pointer;transition:background .2s}
input.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
input.switch:checked{background:var(--accent)}
input.switch:checked::after{transform:translateX(18px)}
input.switch:focus{outline:2px solid var(--accent);outline-offset:2px}
main{padding:16px 16px calc(160px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.fab{position:fixed;right:max(16px, calc((100vw - 720px) / 2 + 16px));bottom:calc(78px + env(safe-area-inset-bottom));z-index:6;
  width:58px;height:58px;min-height:0;padding:0;border-radius:50%;border:0;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--surface);
  border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{flex:1;text-align:center;padding:10px 4px 12px;font-size:13px;color:var(--muted)}
nav.bottom a .ico{display:block;width:24px;height:24px;margin:0 auto 3px;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom a.on{color:var(--accent);font-weight:600}
h2{font-size:22px;margin:4px 0 14px}
h3{font-size:15px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:26px 0 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.title{font-weight:650;font-size:18px}
.cap::first-letter{text-transform:uppercase}
button,.btn{font:inherit;font-size:16px;min-height:44px;padding:8px 16px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text);cursor:pointer}
button:active{transform:scale(.98)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.btn-ghost{background:transparent}
.btn-danger{background:transparent;border-color:var(--no);color:var(--no)}
.btn-sm{min-height:36px;padding:4px 12px;font-size:15px}
.btn-icon{min-width:44px;padding:0 10px}
.full{width:100%}
input,select,textarea{font:inherit;font-size:16px;width:100%;color:var(--text);background:var(--bg);
  border:1px solid var(--border);border-radius:11px;padding:11px 12px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}
.mono,textarea.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:14px;line-height:1.35}
pre.mono{white-space:pre;overflow-x:auto;margin:0;background:var(--bg);border:1px solid var(--border);
  border-radius:11px;padding:12px;-webkit-overflow-scrolling:touch}
pre.lyrics{white-space:pre-wrap;font-family:inherit;margin:0;background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:12px}
.vote{display:flex;gap:8px}
.vote button{flex:1;min-height:44px;padding:6px 4px;font-size:15px;background:var(--bg)}
.vote button.yes.on{background:var(--yes);border-color:var(--yes);color:#06210f;font-weight:700}
.vote button.maybe.on{background:var(--maybe);border-color:var(--maybe);color:#2a1f02;font-weight:700}
.vote button.no.on{background:var(--no);border-color:var(--no);color:#2a0705;font-weight:700}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.yes{background:rgba(63,185,107,.18);color:var(--yes)}
.chip.maybe{background:rgba(227,179,65,.18);color:var(--maybe)}
.chip.no{background:rgba(229,83,75,.18);color:var(--no)}
.chip.pret{background:rgba(63,185,107,.18);color:var(--yes)}
.chip.en-cours{background:rgba(227,179,65,.18);color:var(--maybe)}
.chip.a-apprendre{background:rgba(166,166,176,.15);color:var(--muted)}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.member-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.member-row:last-child{border-bottom:0}
.set-item{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px}
.set-num{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.set-item textarea{min-height:60px;margin-top:8px;font-size:15px}
.drag-handle{flex:none;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:22px;line-height:1;
  color:var(--muted);padding:8px 6px;margin:-8px 0 -8px -4px}
.sortable-ghost{opacity:.35}
.sortable-chosen{border-color:var(--accent)!important;box-shadow:0 6px 20px rgba(0,0,0,.5)}
details summary{cursor:pointer;color:var(--muted);padding:10px 0;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.back{display:inline-block;color:var(--muted);margin-bottom:8px;padding:6px 0}
.hidden{display:none!important}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;background:#2d2d35;color:var(--text);
  border:1px solid var(--border);border-radius:12px;padding:12px 14px;text-align:center;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:none}
.picker{max-width:420px;margin:40px auto 0;text-align:center}
.picker button{width:100%;margin-bottom:10px;font-size:18px;min-height:54px}
.loading{color:var(--muted);text-align:center;padding:40px 0}
.history-item{padding:10px 0;border-bottom:1px solid var(--border)}
.history-item:last-child{border-bottom:0}
:root{--l0:#6b6b75;--l1:#e3b341;--l2:#3fb96b;--l3:#4c9aff}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.dot{font-size:12px;font-weight:700;padding:2px 7px;border-radius:99px;border:1px solid transparent}
.dot.pas-commence{background:rgba(107,107,117,.2);color:#b8b8c2;border-color:#45454e}
.dot.apprentissage{background:rgba(227,179,65,.18);color:var(--l1)}
.dot.gere{background:rgba(63,185,107,.18);color:var(--l2)}
.dot.maitrise{background:rgba(76,154,255,.2);color:var(--l3)}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.levels button{min-height:48px;font-size:15px;background:var(--bg)}
.levels button.on.pas-commence{background:var(--l0);border-color:var(--l0);color:#fff;font-weight:700}
.levels button.on.apprentissage{background:var(--l1);border-color:var(--l1);color:#2a1f02;font-weight:700}
.levels button.on.gere{background:var(--l2);border-color:var(--l2);color:#06210f;font-weight:700}
.levels button.on.maitrise{background:var(--l3);border-color:var(--l3);color:#04172f;font-weight:700}
.prog-row{padding:10px 0;border-bottom:1px solid var(--border)}
.prog-row:last-child{border-bottom:0}
.seg{display:flex;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:transparent;min-height:40px}
.seg button.on{background:var(--surface2);color:var(--accent);font-weight:700}
label.check{display:flex;gap:12px;align-items:center;color:var(--text);font-size:16px;margin:0;padding:9px 0;border-bottom:1px solid var(--border)}
label.check:last-child{border-bottom:0}
label.check input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.alert{margin-top:8px;font-size:14px;font-weight:600;color:var(--maybe)}
.alert.ok{color:var(--yes)}
.alert.no{color:var(--no)}
.cancelled{opacity:.6}
.cancelled .title,.cancelled .strike{text-decoration:line-through}
.cal-cell.cancel{opacity:.45;text-decoration:line-through}
.sheet-wrap{position:fixed;inset:0;z-index:30}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:sheetFade .2s ease-out}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--border);border-bottom:0;border-radius:20px 20px 0 0;animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
.sheet-grab{flex:none;width:40px;height:5px;border-radius:3px;background:var(--border);margin:8px auto 2px}
.sheet-body{flex:1;overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-foot{flex:none;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
body.sheet-open{overflow:hidden}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet,.sheet-bg{animation:none}}
.cal-cell.empty-day{cursor:pointer}
.cal-cell.empty-day:active{background:var(--surface2)}
.pill-row{margin-top:10px}
.pill{display:inline-block;font-size:13px;font-weight:600;line-height:1.35;padding:4px 11px;border-radius:99px}
.pill.warn{background:rgba(227,179,65,.16);color:#e9c46a}
.pill.ok{background:rgba(63,185,107,.16);color:#5fcf88}
.pill.no{background:rgba(229,83,75,.15);color:#ef7b74}
.pill.past{background:rgba(122,122,133,.16);color:#a6a6b0}
.cal-dow{color:var(--muted)!important}
.banner{display:block;position:relative;margin:0 0 16px;padding:14px 16px 14px 20px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--border);
  background:linear-gradient(90deg, color-mix(in srgb, var(--c) 16%, var(--surface)), var(--surface) 75%);border-color:color-mix(in srgb, var(--c) 45%, var(--border))}
.banner::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:0 4px 4px 0;background:var(--c)}
.banner-label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.banner-title{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner-state{display:flex;align-items:center;gap:8px;margin-top:6px;font-weight:650;color:var(--c)}
.banner-dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.banner-next{display:block;margin-top:8px;font-size:14px;color:var(--muted)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h2{margin:0;text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{text-align:center;font-size:12px;font-weight:700;padding-bottom:4px}
.cal-cell{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;
  border:1px solid transparent;font-size:15px;color:var(--muted)}
.cal-cell.has{font-weight:800;font-size:16px}
.cal-cell.today{outline:2px solid var(--text);outline-offset:-2px;color:var(--text)}
.cal-more{position:absolute;bottom:1px;right:4px;font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
#calSwipe{touch-action:pan-y;overflow:hidden}
.swipe-vp{position:relative;overflow:hidden;touch-action:pan-y;margin:0 -16px;padding:0 16px}
.swipe-track{position:relative;will-change:transform}
.pane-side{position:absolute;top:0;width:100%}
.pane-prev{left:calc(-100% - 32px)}
.pane-next{left:calc(100% + 32px)}
.thumb{flex:none;border-radius:8px;object-fit:cover;background:var(--surface2)}
.thumb.ph{display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;font-size:16px;border:1px solid var(--border)}
.cover-big{display:block;width:100%;max-width:320px;aspect-ratio:1;object-fit:cover;border-radius:14px;margin:4px auto 10px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.cover-add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:320px;aspect-ratio:2.4;margin:4px auto 10px;
  border:2px dashed var(--border);border-radius:14px;color:var(--muted);cursor:pointer;font-size:16px}
.file-hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
audio{width:100%;margin-top:8px;color-scheme:dark}
.audio-item{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
input[type=file]{padding:9px;font-size:15px}
label.pick{display:flex;align-items:center;justify-content:center;gap:10px;min-height:50px;margin:0;border-radius:11px;
  border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:16px;font-weight:600;cursor:pointer}
label.pick svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.player{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:6;display:flex;align-items:center;gap:8px;
  background:#1f1f25;border-top:1px solid var(--border);padding:8px 10px 6px;box-shadow:0 -6px 18px rgba(0,0,0,.35)}
.pl-cover{flex:none;width:46px;height:46px;border-radius:8px;overflow:hidden;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700}
.pl-cover img{width:100%;height:100%;object-fit:cover}
.pl-title{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.pl-time{font-size:11px;color:var(--muted);min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
#plSeek{flex:1;padding:0;height:20px;border:0;background:transparent;accent-color:var(--accent)}
.pl-btn{flex:none;width:40px;height:40px;min-height:0;padding:0;border:0;background:transparent;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text)}
.pl-btn svg{width:20px;height:20px;fill:currentColor;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.pl-btn.pl-main{width:46px;height:46px;background:var(--accent);color:#fff}
.pl-btn:disabled{opacity:.3}
body.playing main{padding-bottom:calc(236px + env(safe-area-inset-bottom))}
body.playing .fab{bottom:calc(158px + env(safe-area-inset-bottom))}
body.playing #toast{bottom:calc(160px + env(safe-area-inset-bottom))}
.player{cursor:pointer}
.np{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;background:var(--bg);animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
body.np-open{overflow:hidden}
.np-top{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 6px) 10px 4px}
.np-label{font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.np-chev{fill:none!important;stroke-width:2.2!important;width:24px!important;height:24px!important}
.np-body{flex:1;overflow-y:auto;padding:4px 20px calc(28px + env(safe-area-inset-bottom));max-width:560px;width:100%;margin:0 auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.np-cover{width:min(62vw,260px);aspect-ratio:1;margin:6px auto 16px;border-radius:16px;overflow:hidden;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:800;color:var(--muted);box-shadow:0 12px 32px rgba(0,0,0,.5)}
.np-cover img{width:100%;height:100%;object-fit:cover}
.np-title{font-size:22px;font-weight:750;text-align:center}
.np-sub{color:var(--muted);text-align:center;margin-top:2px;min-height:1.4em}
.np-bar{position:relative;height:28px;margin-top:14px}
.np-track{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:var(--surface2)}
.np-loop{position:absolute;z-index:2;top:8px;height:12px;border-radius:6px;background:rgba(255,255,255,.18);border:2px solid #fff;pointer-events:none}
.np-mark{position:absolute;z-index:2;top:5px;width:3px;height:18px;margin-left:-1px;border-radius:2px;background:#fff;pointer-events:none}
.np-bar input[type=range]{position:absolute;inset:0;width:100%;height:28px;padding:0;margin:0;border:0;background:transparent;accent-color:var(--accent)}
.np-times{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.np-ctrl{display:flex;align-items:center;justify-content:center;gap:28px;margin:8px 0 18px}
.np-big{width:52px;height:52px}
.np-big svg{width:26px;height:26px}
.np-play{width:68px!important;height:68px!important}
.np-play svg{width:30px!important;height:30px!important}
.np-tool{margin-bottom:12px}
.np-tool-label{font-weight:700}
.np-range{padding:0;height:30px;border:0;background:transparent;accent-color:var(--accent)}

.pl-open svg{fill:none!important;stroke-width:2.2!important;width:22px!important;height:22px!important}

.np-cmmarks{position:absolute;left:0;right:0;top:0;height:28px;pointer-events:none;z-index:1}

/* ===== Apparence « compacte » : mêmes éléments, aux mêmes places, mais en lignes comme la page Écoute ===== */

body.look-compact .audio-item,

body.look-compact :not(.card):not(.audio-item):not(.set-item) + .audio-item,
body.look-compact :not(.card):not(.audio-item):not(.set-item) + .set-item,
body.look-compact .card:first-child,body.look-compact .set-item:first-child{border-top:1px solid var(--border)}
body.look-compact .card + :not(.card):not(.audio-item):not(.set-item):not(h3):not(h2):not(details),
body.look-compact .audio-item + :not(.audio-item),
body.look-compact .set-item + :not(.set-item){margin-top:12px}

.w-only{display:none}
.w-flex{display:none!important}
.split-empty{color:var(--muted);text-align:center;padding:80px 20px}
/* ===== Version ordinateur (grand écran) ===== */
@media (min-width: 900px){
  :root{--side:236px;--plh:84px}
  html,body{font-size:15px}
  .m-only{display:none}
  .w-only{display:inline}
  .w-flex{display:flex!important}
  .cal-head{gap:14px}
  .sw-arrow{align-items:center;justify-content:center;width:38px;height:38px;min-height:0;padding:0 0 3px;border-radius:50%;font-size:24px;line-height:1;background:var(--surface2)}
  .split-nav{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}
  .split-nav button:disabled{opacity:.35;cursor:default}
  /* Menu à gauche : nom du groupe, membre, cloche puis les pages */
  header.top{position:fixed;left:0;top:0;width:var(--side);height:118px;flex-direction:column;align-items:stretch;justify-content:center;gap:10px;
    padding:18px 20px;background:var(--surface);backdrop-filter:none;border-bottom:0;border-right:1px solid var(--border);z-index:7}
  header.top h1{font-size:19px}
  header.top > .row{justify-content:space-between}
  .bell{margin:0}
  nav.bottom{top:118px;bottom:0;left:0;right:auto;width:var(--side);flex-direction:column;gap:2px;padding:6px 12px 16px;
    border-top:0;border-right:1px solid var(--border);z-index:7}
  nav.bottom a{flex:none;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:10px;font-size:15px}
  nav.bottom a .ico{margin:0;width:20px;height:20px}
  nav.bottom a.on{background:rgba(232,100,58,.12)}
  /* Écran de connexion : pas de menu */
  body:has(#nav.hidden) header.top{position:sticky;width:auto;height:auto;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--border)}
  body:has(#nav.hidden) main{margin-left:auto}
  main{margin-left:max(var(--side), calc(var(--side) + (100vw - var(--side) - 860px) / 2));max-width:860px;padding:32px 40px 120px}
  main:has(> .split){margin-left:var(--side);max-width:1500px}
  body.playing main{padding-bottom:calc(var(--plh) + 60px)}
  h2{font-size:24px}
  .card{padding:16px 18px}
  button,.btn{font-size:15px}
  input,select,textarea{font-size:15px}
  .fab{right:40px;bottom:36px}
  body.playing .fab{bottom:calc(var(--plh) + 24px)}
  #toast{left:auto;right:40px;width:380px;bottom:36px}
  body.playing #toast{bottom:calc(var(--plh) + 24px)}
  /* Deux colonnes : liste à gauche (défile seule), détail à droite */
  .split{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:40px;align-items:start}
  .split[data-split=cal]{grid-template-columns:minmax(360px,470px) minmax(0,1fr)}
  .split-list{position:sticky;z-index:4;top:24px;max-height:calc(100vh - 48px);overflow-y:auto;overflow-x:hidden;padding:2px 8px 24px 2px;overscroll-behavior:contain;scrollbar-width:thin}
  body.playing .split-list{max-height:calc(100vh - 48px - var(--plh))}
  .split-list .swipe-vp{margin:0;padding:0}
  .split-main{min-width:0}
  .split-main .back,.split-main .swipe-hint{display:none}
  .split-list .card.sel{box-shadow:0 0 0 2px var(--accent);background:#222228}
  .split-list .cal-cell.sel{box-shadow:0 0 0 2px #fff}
  .split-list .banner{margin-bottom:12px}
  .split-list h3{margin-top:22px}
  /* Lecteur : barre pleine largeur en bas */

<script>
// ===== Configuration Supabase =====
const SB_URL = 'https://gdwwolgxivucqzdkvqfl.supabase.co';

// Compte unique du groupe (le mot de passe n'est PAS dans le code, chacun le tape à la connexion)

// ===== Constantes =====
const VOTES = [
  { key: 'oui', label: 'Oui', cls: 'yes' },
  { key: 'peut-etre', label: 'Peut-être', cls: 'maybe' },
  { key: 'non', label: 'Non', cls: 'no' },

const VOTE_BY_KEY = Object.fromEntries(VOTES.map(v => [v.key, v]));
const SONG_STATUS = { 'a-apprendre': 'À apprendre', 'en-cours': 'En cours', 'pret': 'Prêt' };
const LEVELS = [

const LEVEL_BY_KEY = Object.fromEntries(LEVELS.map(l => [l.key, l]));

// ===== Stockage des fichiers (audio, pochettes) =====
const MEDIA = 'media';
const MAX_FILE = 50 * 1024 * 1024; // 50 Mo, limite de l'offre gratuite
const urlCache = new Map();

// Liens temporaires vers les fichiers privés (gardés en mémoire pour éviter de recharger)
async function signedUrls(paths) {
  const need = [...new Set(paths.filter(p => p && !urlCache.has(p)))];
  if (need.length) {
    const { data, error } = await db.storage.from(MEDIA).createSignedUrls(need, 60 * 60 * 24 * 7);
    if (!error) (data || []).forEach(d => { if (d.signedUrl) urlCache.set(d.path, d.signedUrl); });
  }
  return p => (p && urlCache.get(p)) || '';
}
function coverThumb(title, url, size = 44) {
  return url
    ? `<img class="thumb" src="${esc(url)}" alt="" loading="lazy" style="width:${size}px;height:${size}px">`
    : `<span class="thumb ph" style="width:${size}px;height:${size}px">${esc((title || '?').trim().charAt(0).toUpperCase())}</span>`;
}
// Réduit une image à max×max pixels en JPEG avant l'envoi
function resizeImage(file, max) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('Image illisible')), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image illisible')); };
    img.src = url;
  });
}
function audioType(file) {
  if (file.type) return file.type;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  return { mp3: 'audio/mpeg', m4a: 'audio/mp4', aac: 'audio/aac', wav: 'audio/wav', ogg: 'audio/ogg', opus: 'audio/ogg', flac: 'audio/flac' }[ext] || 'application/octet-stream';
}
function fmtSize(b) { return b > 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' Mo' : Math.max(1, Math.round(b / 1024)) + ' Ko'; }
// Un seul enregistrement lu à la fois
document.addEventListener('play', e => {
  document.querySelectorAll('audio').forEach(a => { if (a !== e.target) a.pause(); });
}, true);

// ===== Jours de la semaine et couleurs (index = getDay(), 0 = dimanche) =====
const DAYS = [
  { name: 'dimanche', short: 'Dim', color: '#e3c341' },
  { name: 'lundi', short: 'Lun', color: '#4c9aff' },
  { name: 'mardi', short: 'Mar', color: '#a371f7' },
  { name: 'mercredi', short: 'Mer', color: '#8a9bb8' },
  { name: 'jeudi', short: 'Jeu', color: '#2ec4b6' },
  { name: 'vendredi', short: 'Ven', color: '#f06292' },
  { name: 'samedi', short: 'Sam', color: '#3fb96b' },
];
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0]; // lundi en premier
const DEFAULT_WEEKDAY = 4;                 // jeudi
const DEFAULT_TIME = '20:00';
const MIN_PRESENT = 4;                     // votes « On maintient » nécessaires

function dateObj(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d, 12); }
function isoOf(dt) { return dt.toLocaleDateString('sv-SE'); }
function dayInfo(iso) { return DAYS[dateObj(iso).getDay()]; }
function nextWeekday(fromIso, wd) {
  const dt = dateObj(fromIso);
  dt.setDate(dt.getDate() + ((wd - dt.getDay() + 7) % 7));
  return isoOf(dt);
}
// État d'une répète selon les dispos et le vote « on répète quand même ? »
// - Personne d'absent : « confirmee » si tout le monde a répondu oui, sinon « attente »
//   (réponses manquantes ou « peut-être » : le peut-être bloque la confirmation)
// - Au moins un absent : le vote s'ouvre quand tout le monde a répondu ; la répète est maintenue
//   si TOUS les présents votent « On maintient ». Moins de 4 présents = annulée par défaut.
// États : confirmee · attente · vote · maintenue · annulee
function rehState(r) {
  const av = r.availability || [], votes = r.rehearsal_votes || [];
  const statusOf = m => av.find(a => a.member === m)?.status;
  const pending = state.members.filter(m => !statusOf(m));
  const absents = state.members.filter(m => statusOf(m) === 'non');
  const maybes = state.members.filter(m => statusOf(m) === 'peut-etre');
  const present = state.members.filter(m => statusOf(m) === 'oui');
  const base = { absents, pending, maybes, present, voters: [], maintain: [], annul: [], tooFew: false, open: false };
  if (!absents.length) return { ...base, s: state.members.length && !pending.length && !maybes.length ? 'confirmee' : 'attente' };
  const voters = state.members.filter(m => !absents.includes(m)); // les absents ne votent pas
  const vOf = m => votes.find(v => v.member === m)?.vote;
  const maintain = voters.filter(m => vOf(m) === 'maintenir');
  const annul = voters.filter(m => vOf(m) === 'annuler');
  const tooFew = voters.length < MIN_PRESENT;
  const open = pending.length === 0; // vote seulement quand tout le monde a répondu
  let s;
  if (open && voters.length && maintain.length === voters.length) s = 'maintenue';
  else if (tooFew || (open && annul.length)) s = 'annulee';
  else if (!open) s = 'attente';
  else s = 'vote';
  return { ...base, s, voters, maintain, annul, tooFew, open };
}
// Texte court de l'état (pilules, bandeau)
function stateText(r) {
  const st = rehState(r), n = state.members.length;
  const names = st.absents.join(', ');
  switch (st.s) {
    case 'confirmee': return `On répète · ${st.present.length}/${n} présents`;
    case 'maintenue': return `On répète · maintenue${st.tooFew ? ' quand même' : ''} sans ${names}`;
    case 'annulee': return st.annul.length ? `Annulée · absent${st.absents.length > 1 ? 's' : ''} : ${names}`
      : `Annulée · moins de ${MIN_PRESENT} · absent${st.absents.length > 1 ? 's' : ''} : ${names}`;
    case 'vote': return `Vote en cours · il manque ${names} (${st.maintain.length}/${st.voters.length})`;
    default:
      if (st.absents.length) return `Il manque ${names} · en attente ${n - st.pending.length}/${n}`;
      if (st.pending.length) return `En attente · ${n - st.pending.length}/${n} réponses`;
      return `En attente · peut-être : ${st.maybes.join(', ')}`;
  }
}
const STATE_COLOR = { confirmee: '#3fb96b', maintenue: '#3fb96b', attente: '#e3b341', vote: '#e3b341', annulee: '#e5534b' };
const PAST_COLOR = '#7a7a85';
function rehColor(r) { return r.date < todayISO() ? PAST_COLOR : STATE_COLOR[rehState(r).s]; }
function stateHtml(r) {
  const s = rehState(r).s;
  const cls = s === 'annulee' ? 'no' : (s === 'confirmee' || s === 'maintenue') ? 'ok' : 'warn';

}
// Bandeau « Prochaine répète » (et la suivante si la prochaine est annulée)
function nextBannerHtml(list) {
  const today = todayISO();
  const up = list.filter(r => r.date >= today);
  if (!up.length) return '';
  const first = up[0];
  const then = rehState(first).s === 'annulee' ? up.slice(1).find(r => rehState(r).s !== 'annulee') : null;

  </a>`;
}
function decisionHtml(r) {
  const st = rehState(r);
  if (!st.absents.length) return '';
  const myVote = (r.rehearsal_votes || []).find(v => v.member === state.me)?.vote;
  const waiting = st.voters.filter(m => !st.maintain.includes(m) && !st.annul.includes(m));
  const absents = `<strong>${esc(st.absents.join(', '))}</strong>`;
  if (!st.open) return `

      <div>Il manque ${absents}. Le vote s'ouvrira quand tout le monde aura donné sa dispo.</div>

  return `

    <div class="card">
      <div style="margin-bottom:12px">Il manque ${absents}. ${st.tooFew
        ? `Vous êtes moins de ${MIN_PRESENT} : la répète est annulée, sauf si <strong>tous les présents</strong> votent « On maintient quand même ».`
        : `La répète est maintenue si <strong>tous les présents</strong> votent « On maintient ».`}</div>
      ${st.voters.includes(state.me) ? `
        <div class="vote">
          <button class="yes ${myVote === 'maintenir' ? 'on' : ''}" data-act="decide" data-id="${r.id}" data-v="maintenir">${st.tooFew ? 'On maintient quand même' : 'On maintient'}</button>
          <button class="no ${myVote === 'annuler' ? 'on' : ''}" data-act="decide" data-id="${r.id}" data-v="annuler">On annule</button>
        </div>` : `<div class="muted small">Tu es absent, tu ne votes pas.</div>`}
      ${`

          <div><span style="color:var(--no);font-weight:600">Annule :</span> ${esc(st.annul.join(', ') || 'personne')}</div>
          ${waiting.length ? `<div class="muted">Pas encore voté : ${esc(waiting.join(', '))}</div>` : ''}
        </div>`}
      ${stateHtml(r)}

}

// Niveau d'un membre sur un morceau (pas d'entrée = pas commencé)
function levelOf(progress, member) {
  return (progress || []).find(p => p.member === member)?.level || 'pas-commence';
}
// Statut calculé : prêt si tout le monde gère au moins, en cours si quelqu'un a commencé
function songStatus(progress) {
  const ranks = state.members.map(m => LEVEL_RANK[levelOf(progress, m)]);
  if (ranks.length && ranks.every(r => r >= LEVEL_RANK.gere)) return 'pret';
  if (ranks.some(r => r >= LEVEL_RANK.apprentissage)) return 'en-cours';
  return 'a-apprendre';
}
// Pastilles colorées, une par membre
function dotsHtml(progress) {
  return `<div class="dots">${state.members.map(m => {
    const l = levelOf(progress, m);
    return `<span class="dot ${l}" title="${esc(m)} : ${LEVEL_BY_KEY[l].label}">${esc(m.slice(0, 3))}</span>`;
  }).join('')}</div>`;
}

async function routeSplit(view, id, sub) {
  const kind = view.startsWith('repete') ? 'reh' : view.startsWith('morceau') ? 'song' : 'cal';
  let s = APP.querySelector(':scope > .split');
  if (!s || s.dataset.split !== kind) {
    APP.innerHTML = `<div class="split" data-split="${kind}"><section class="split-list"></section><section class="split-main"></section></div>`;
    s = APP.firstElementChild;
  }
  const [L, R] = s.children;
  let sel = null;
  if (kind === 'reh') {
    if (id) { sel = id; state.detailReh = sel; await Promise.all([viewRehearsals(L), viewRehearsal(sel, R)]); }
    else {
      await viewRehearsals(L);
      sel = L.querySelector('.card a[href^="#/repete/"]')?.getAttribute('href').split('/')[2] || null;
      state.detailReh = sel;
      if (sel) await viewRehearsal(sel, R);
      else R.innerHTML = `<div class="split-empty">Aucune répète.<br>Ajoute la prochaine avec le bouton +.</div>`;
    }
  } else if (kind === 'song') {
    if (id) { sel = id; state.detailSong = sel; await Promise.all([viewSongs(L), viewSong(sel, R)]); }
    else {
      await viewSongs(L);
      sel = L.querySelector('a.song-link')?.getAttribute('href').split('/')[2] || null;
      state.detailSong = sel;
      if (sel) await viewSong(sel, R);
      else R.innerHTML = `<div class="split-empty">Aucun morceau pour l'instant.<br>Ajoute le premier avec le bouton +.</div>`;
    }
  } else {
    const ym = /^\d{4}-\d{2}$/.test(id || '') ? id : todayISO().slice(0, 7);
    await viewCalendar(ym, L);
    // Dans le calendrier, choisir une répète l'affiche à droite sans quitter le calendrier
    L.querySelectorAll('a[href^="#/repete/"]').forEach(a => a.setAttribute('href', `#/calendrier/${ym}/${a.getAttribute('href').split('/')[2]}`));
    if (sub) sel = sub;
    else {
      const cards = [...L.querySelectorAll('a.card[data-rid]')];
      sel = (cards.find(a => a.dataset.date >= todayISO()) || cards[0])?.dataset.rid || null;
    }
    state.detailReh = sel;
    if (sel) {
      await viewRehearsal(sel, R);
      // Pas de glisser vers les répètes voisines ici : on choisit dans le calendrier
      const vp = R.querySelector('.swipe-vp');
      if (vp) { vp.dataset.prev = ''; vp.dataset.next = ''; vp.querySelectorAll('.pane-side').forEach(p => p.remove()); }
    } else R.innerHTML = `<div class="split-empty">Aucune répète ce mois-ci.<br>Clique sur un jour libre pour en créer une.</div>`;
  }
  // Flèches précédente / suivante au-dessus du détail
  const vp = R.querySelector('.swipe-vp');
  if (vp && kind !== 'cal') {
    const what = kind === 'reh' ? ['Répète précédente', 'Répète suivante'] : ['Morceau précédent', 'Morceau suivant'];
    R.insertAdjacentHTML('afterbegin', `<div class="split-nav">
      <button class="btn-sm" data-swipe="prev" ${vp.dataset.prev ? '' : 'disabled'} title="${what[0]}">‹ ${what[0]}</button>
      <button class="btn-sm" data-swipe="next" ${vp.dataset.next ? '' : 'disabled'} title="${what[1]}">${what[1]} ›</button></div>`);
  }
  // Élément choisi mis en évidence dans la liste
  if (sel) L.querySelectorAll(`a[href$="/${sel}"]`).forEach(a => (a.closest('.card') || (a.classList.contains('cal-cell') ? a : null))?.classList.add('sel'));
  if (state.splitKey !== kind + sel) { if (state.splitKey) window.scrollTo(0, 0); state.splitKey = kind + sel; }
}

// ===== Fenêtres superposées et bouton retour =====
// Chaque fenêtre ouverte ajoute une étape dans l'historique ; le bouton retour ne ferme que celle du dessus.
const Layers = {
  stack: [], ignore: 0,
  push(name) { this.stack.push(name); history.pushState({ layer: name }, ''); },
  // Appelé par chaque fenêtre quand elle se ferme
  closed(name, fromHistory) {
    const i = this.stack.lastIndexOf(name);
    if (i >= 0) this.stack.splice(i, 1);
    if (!fromHistory) { this.ignore++; history.back(); } // retour silencieux pour retirer son étape
  },
};
window.addEventListener('popstate', () => {
  if (Layers.ignore > 0) { Layers.ignore--; return; }
  const top = Layers.stack[Layers.stack.length - 1];
  const obj = { sheet: Sheet, np: Np, dv: Dv, mk: Mk, fs: Fs }[top];
  if (obj && obj.isOpen) obj.close(true);
  else if (top) Layers.stack.pop();
});

// ===== Fenêtre qui monte du bas (popup) =====
const Sheet = {
  open(formName, bodyHtml, footHtml) {
    const f = document.getElementById('sheetForm');
    f.dataset.form = formName;
    f.id = 'sheetForm';
    document.getElementById('sheetBody').innerHTML = bodyHtml;
    document.getElementById('sheetFoot').innerHTML = footHtml;
    document.getElementById('sheet').classList.remove('hidden');
    document.body.classList.add('sheet-open');
    document.getElementById('sheetBody').scrollTop = 0;
    if (!this.isOpen) { Layers.push('sheet'); this.isOpen = true; }
  },
  // fromHistory : fermeture déclenchée par le bouton retour du téléphone
  close(fromHistory) {
    if (!this.isOpen) return;
    this.isOpen = false;
    document.getElementById('sheet').classList.add('hidden');
    document.body.classList.remove('sheet-open');
    document.getElementById('sheetBody').innerHTML = '';
    Layers.closed('sheet', fromHistory);
  },
};

document.addEventListener('keydown', e => { if (e.key === 'Escape' && Sheet.isOpen) Sheet.close(); });

// ===== Série de répètes =====
function seriesDates(f) {
  const wd = Number(f.elements.weekday.value);
  const start = f.elements.start.value || todayISO();
  const end = f.elements.end.value;
  if (!end || end < start) return null;
  const dates = [];
  const dt = dateObj(nextWeekday(start, wd));
  while (isoOf(dt) <= end && dates.length < 52) { dates.push(isoOf(dt)); dt.setDate(dt.getDate() + 7); }
  return dates;
}
function updateSeriesPreview() {
  const f = document.getElementById('sheetForm');
  if (!f || !f.elements.weekday) return;
  const dates = seriesDates(f);
  if (!dates) {
    document.getElementById('seriesPreview').innerHTML = `<div class="pill-row"><span class="pill no">La date de fin est avant la date de début</span></div>`;
    updateSubmitLabel();
    return;
  }
  if (!dates.length) {
    document.getElementById('seriesPreview').innerHTML = `<div class="muted small">Aucun ${esc(DAYS[Number(f.elements.weekday.value)].name)} dans cette période.</div>`;
    updateSubmitLabel();
    return;
  }
  document.getElementById('seriesPreview').innerHTML = dates.map(iso => {
    const exists = state.existingDates.has(iso);
    return `<label class="check"><input type="checkbox" name="dates" value="${iso}" ${exists ? '' : 'checked'}>
      <span class="cap">${esc(fmtDate(iso, { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' }))}</span>
      ${exists ? '<span class="muted small">(déjà prévue)</span>' : ''}</label>`;
  }).join('');
  updateSubmitLabel();
}
function updateSubmitLabel() {
  const f = document.getElementById('sheetForm');
  const b = document.getElementById('newRehSubmit');
  if (!f || !b) return;
  if (f.elements.mode.value === 'series') {
    const c = f.querySelectorAll('input[name=dates]:checked').length;
    b.textContent = `Créer ${c} répète${c > 1 ? 's' : ''}`;
  } else b.textContent = 'Créer';
}

// ===== Calendrier =====
// Une page du calendrier (titre + grille) pour un mois donné
function monthPane(ym, byDate, today, isCurrent) {
  const [y, m] = ym.split('-').map(Number);
  const first = new Date(y, m - 1, 1, 12), last = new Date(y, m, 0, 12);
  const offset = (first.getDay() + 6) % 7; // semaine commençant le lundi
  let cells = WEEK_ORDER.map(i => `<div class="cal-dow">${DAYS[i].short}</div>`).join('');
  for (let i = 0; i < offset; i++) cells += '<div></div>';
  for (let d = 1; d <= last.getDate(); d++) {
    const iso = `${ym}-${String(d).padStart(2, '0')}`;
    const list = byDate[iso];
    const todayCls = iso === today ? ' today' : '';
    if (list) {
      // Plusieurs répètes le même jour : on montre la première qui n'est pas annulée
      const main = list.find(r => rehState(r).s !== 'annulee') || list[0];
      const c = rehColor(main);
      const cancel = rehState(main).s === 'annulee' ? ' cancel' : '';
      cells += `<a class="cal-cell has${todayCls}${cancel}" href="#/repete/${main.id}" title="${esc(stateText(main))}" style="background:${c}38;border-color:${c};color:${c}">${d}
        ${list.length > 1 ? `<span class="cal-more">×${list.length}</span>` : ''}</a>`;
    } else if (iso >= today) {
      // Jour vide (aujourd'hui ou futur) : un appui ouvre la fenêtre de création
      cells += `<div class="cal-cell empty-day${todayCls}" data-act="newreh" data-date="${iso}">${d}</div>`;
    } else cells += `<div class="cal-cell${todayCls}">${d}</div>`;
  }
  return `
    <div class="cal-head" style="justify-content:center">
      <button class="sw-arrow w-flex" data-swipe="prev" aria-label="Mois précédent" title="Mois précédent">‹</button>
      <h2 style="cursor:pointer" data-act="calnav" data-ym="${today.slice(0, 7)}" data-dir="${ym > today.slice(0, 7) ? 'prev' : 'next'}"
        title="Revenir au mois en cours">${esc(first.toLocaleDateString('fr-CH', { month: 'long', year: 'numeric' }))}</h2>
      <button class="sw-arrow w-flex" data-swipe="next" aria-label="Mois suivant" title="Mois suivant">›</button>
    </div>
    <div class="cal-grid ${isCurrent && state.calDir ? 'cal-in-' + state.calDir : ''}">${cells}</div>`;
}

async function viewCalendar(ym, $app = APP) {
  const today = todayISO();
  if (!/^\d{4}-\d{2}$/.test(ym || '')) ym = today.slice(0, 7);
  const [y, m] = ym.split('-').map(Number);
  const prev = isoOf(new Date(y, m - 2, 1, 12)).slice(0, 7);
  const next = isoOf(new Date(y, m, 1, 12)).slice(0, 7);
  // On charge 3 mois d'un coup : le précédent et le suivant s'affichent pendant le glisser
  const from = isoOf(new Date(y, m - 2, 1, 12)), to = isoOf(new Date(y, m + 1, 0, 12));
  const all = await q(db.from('rehearsals').select('id,date,time,place,availability(member,status),rehearsal_votes(member,vote)')
    .gte('date', from).lte('date', to).order('date').order('time'));
  const byDate = {};
  all.forEach(r => (byDate[r.date] = byDate[r.date] || []).push(r));
  const reh = all.filter(r => r.date.startsWith(ym));
  // Les prochaines répètes (pour le bandeau), quel que soit le mois affiché
  const upcoming = await q(db.from('rehearsals').select('id,date,time,place,availability(member,status),rehearsal_votes(member,vote)')
    .gte('date', today).order('date').order('time').limit(8));
  const legend = [['On répète', STATE_COLOR.confirmee], ['Pas encore décidé', STATE_COLOR.attente], ['Annulée', STATE_COLOR.annulee, 1], ['Passée', PAST_COLOR]];

  $app.innerHTML = `
    ${nextBannerHtml(upcoming)}
    ${swipeFrame('cal', prev, next, monthPane(prev, byDate, today), monthPane(ym, byDate, today, true), monthPane(next, byDate, today))}
    <p class="muted small" style="text-align:center;margin:8px 0 0"><span class="m-only">Glisse pour changer de mois · touche un jour libre pour créer une répète</span><span class="w-only">‹ › ou glisse à deux doigts sur le pavé tactile pour changer de mois · clique sur un jour libre pour créer une répète</span></p>
    <div class="legend">${legend.map(([l, c, strike]) => `<span class="chip" style="background:${c}2e;color:${c}${strike ? ';text-decoration:line-through' : ''}">${l}</span>`).join('')}</div>

    <h3>Répètes du mois (${reh.length})</h3>
    ${reh.length ? reh.map(r => {
      const c = rehColor(r);
      return `<a class="card ${rehState(r).s === 'annulee' ? 'cancelled' : ''}" style="display:block;border-left:5px solid ${c};padding:10px 14px" href="#/repete/${r.id}" data-rid="${r.id}" data-date="${r.date}">
        <div class="row between"><span class="cap strike"><strong>${esc(fmtDate(r.date, { weekday: 'long', day: 'numeric', month: 'long' }))}</strong></span>
        <span class="muted small">${esc(r.time || '')}</span></div>
        ${stateHtml(r)}
      </a>`;
    }).join('') : '<div class="empty">Aucune répète ce mois-ci.</div>'}
  `;
  neutralizeSides();
}

// ===== Glisser « qui suit le doigt » (calendrier et fiches de répète) =====
// Trois pages côte à côte : précédente, actuelle, suivante. La page actuelle suit le doigt
// et la voisine arrive collée à elle. Au lâcher : on change de page ou on revient en place.
const SWIPE_GAP = 32; // espace entre deux pages pendant le glisser

function swipeFrame(kind, prevKey, nextKey, prevHtml, curHtml, nextHtml) {
  return `<div class="swipe-vp" data-kind="${kind}" data-prev="${prevKey || ''}" data-next="${nextKey || ''}">
    <div class="swipe-track">
      ${prevKey ? `<div class="pane pane-side pane-prev" inert aria-hidden="true">${prevHtml}</div>` : ''}
      <div class="pane pane-cur">${curHtml}</div>
      ${nextKey ? `<div class="pane pane-side pane-next" inert aria-hidden="true">${nextHtml}</div>` : ''}
    </div>
  </div>`;
}
// Les pages voisines ne servent qu'à l'affichage : on retire identifiants et actions
// pour qu'elles n'interfèrent jamais avec la page actuelle
function neutralizeSides() {
  $app.querySelectorAll('.pane-side [id]').forEach(el => el.removeAttribute('id'));
  $app.querySelectorAll('.pane-side [data-act], .pane-side [data-change], .pane-side [data-form]').forEach(el => {
    el.removeAttribute('data-act'); el.removeAttribute('data-change'); el.removeAttribute('data-form');
  });
  $app.querySelectorAll('.pane-side a[href]').forEach(a => a.removeAttribute('href'));
}

const Swipe = { g: null, lastSwipe: 0 };
document.addEventListener('touchstart', e => {
  const vp = e.target.closest('.swipe-vp');
  // Pas de glisser si le doigt part de la poignée ☰, d'un champ ou pendant une animation
  if (!vp || e.touches.length !== 1 || vp.dataset.busy || e.target.closest('.drag-handle, input, textarea, select, audio, pre.mono')) { Swipe.g = null; return; }
  const t = e.touches[0];
  Swipe.g = { vp, track: vp.querySelector('.swipe-track'), x0: t.clientX, y0: t.clientY, dx: 0, mode: null,
    w: vp.querySelector('.pane-cur').offsetWidth + SWIPE_GAP, pts: [{ x: t.clientX, t: performance.now() }] };
}, { passive: true });

document.addEventListener('touchmove', e => {
  const g = Swipe.g;
  if (!g) return;
  const t = e.touches[0];
  const dx = t.clientX - g.x0, dy = t.clientY - g.y0;
  if (!g.mode) {
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 8) return;
    g.mode = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'h' : 'v'; // horizontal ou vertical, une fois pour toutes
    if (g.mode !== 'h') return;
    g.track.style.transition = 'none';
    // Si la page est défilée, on aligne le haut des pages voisines sur le haut de l'écran
    const headerH = document.querySelector('header.top')?.offsetHeight || 0;
    g.shift = Math.max(0, headerH - g.vp.getBoundingClientRect().top + 8);
    g.vp.querySelectorAll('.pane-side').forEach(p => { p.style.transform = `translateY(${g.shift}px)`; });
  }
  if (g.mode !== 'h') return;
  let d = dx;
  const target = d < 0 ? g.vp.dataset.next : g.vp.dataset.prev;
  if (!target) d = d * 0.3; // effet élastique quand il n'y a rien de ce côté
  g.dx = d;
  g.track.style.transform = `translate3d(${d}px,0,0)`;
  g.pts.push({ x: t.clientX, t: performance.now() });
  if (g.pts.length > 12) g.pts.shift();
}, { passive: true });

function endSwipe() {
  const g = Swipe.g;
  Swipe.g = null;
  if (!g || g.mode !== 'h') return;
  Swipe.lastSwipe = performance.now();
  const dir = g.dx < 0 ? 'next' : 'prev';
  const target = g.vp.dataset[dir];
  // Vitesse du doigt sur la fin du geste (px/ms) : un coup de doigt vif suffit à changer de page
  const b = g.pts[g.pts.length - 1];
  const a = g.pts.find(p => b.t - p.t <= 120) || g.pts[0];
  const v = (b.x - (a === b ? g.pts[0].x : a.x)) / Math.max(1, b.t - (a === b ? g.pts[0].t : a.t));
  const fling = Math.abs(v) > 0.35 && Math.sign(v) === Math.sign(g.dx);
  const commit = target && (Math.abs(g.dx) > g.w * 0.25 || fling);
  g.track.style.transition = 'transform .28s cubic-bezier(.2,.8,.2,1)';
  if (!commit) {
    g.track.style.transform = 'translate3d(0,0,0)';
    setTimeout(() => g.vp.querySelectorAll('.pane-side').forEach(p => { p.style.transform = ''; }), 300);
    return;
  }
  g.vp.dataset.busy = '1';
  g.track.style.transform = `translate3d(${dir === 'next' ? -g.w : g.w}px,0,0)`;
  setTimeout(() => {
    // La page voisine est maintenant affichée : on remonte en haut (sans saut visible) et on charge la vraie page
    if (g.shift) { g.vp.querySelectorAll('.pane-side').forEach(p => { p.style.transform = ''; }); window.scrollTo(0, 0); }
    state.calDir = null;
    go(swipeHash(g.vp, target));
  }, 290);
}
function swipeHash(vp, target) { return { cal: '#/calendrier/', reh: '#/repete/', song: '#/morceau/' }[vp.dataset.kind] + target; }

// Pavé tactile (glisser à deux doigts) ou Maj + molette : même effet que le glisser au doigt
function swipeTo(vp, dir) {
  const target = vp.dataset[dir], track = vp.querySelector('.swipe-track');
  if (!target || !track || vp.dataset.busy) return;
  const w = vp.querySelector('.pane-cur').offsetWidth + SWIPE_GAP;
  const headerH = isWide() ? 0 : (document.querySelector('header.top')?.offsetHeight || 0);
  const shift = Math.max(0, headerH - vp.getBoundingClientRect().top + 8);
  vp.querySelectorAll('.pane-side').forEach(p => { p.style.transform = `translateY(${shift}px)`; });
  vp.dataset.busy = '1';
  track.style.transition = 'transform .28s cubic-bezier(.2,.8,.2,1)';
  track.style.transform = `translate3d(${dir === 'next' ? -w : w}px,0,0)`;
  setTimeout(() => {
    if (shift) { vp.querySelectorAll('.pane-side').forEach(p => { p.style.transform = ''; }); window.scrollTo(0, 0); }
    state.calDir = null;
    go(swipeHash(vp, target));
  }, 290);
}
// Flèches ‹ › (version ordinateur)
document.addEventListener('click', e => {
  const b = e.target.closest('[data-swipe]');
  if (!b || b.disabled) return;
  const vp = b.closest('.swipe-vp') || b.closest('.split-main')?.querySelector('.swipe-vp');
  if (vp) swipeTo(vp, b.dataset.swipe);
});

// Raccourcis clavier : Espace = lecture/pause, ← → = reculer/avancer de 5 s, Échap = fermer
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && (t.closest('input, textarea, select, [contenteditable]'))) return; // on écrit : pas de raccourci
  if (e.key === 'Escape') {
    const top = Layers.stack[Layers.stack.length - 1];
    const obj = { np: Np, dv: Dv, mk: Mk, fs: Fs }[top]; // la fenêtre du bas (popup) a déjà son Échap
    if (obj && obj.isOpen) { e.preventDefault(); obj.close(); }
    return;
  }
  if (!Player.queue.length || Player.i < 0 || Sheet.isOpen) return; // rien en lecture
  const a = Player.audio;
  if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); Player.toggle(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); a.currentTime = Math.max(0, a.currentTime - 5); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); a.currentTime = Math.min(a.duration || 0, a.currentTime + 5); }
});

const Wheel = { acc: 0, t: 0, locked: false };
document.addEventListener('wheel', e => {
  const vp = e.target.closest('.swipe-vp');
  if (!vp) return;
  let dx = e.deltaX;
  if (!dx && e.shiftKey) dx = e.deltaY;
  if (!dx || Math.abs(dx) < Math.abs(e.deltaY) && !e.shiftKey) return; // geste vertical : défilement normal
  if (e.target.closest('pre.mono, input, textarea, select')) return; // contenu qui défile lui-même de côté
  e.preventDefault(); // évite aussi le « page précédente » du navigateur
  const now = performance.now();
  if (now - Wheel.t > 220) { Wheel.acc = 0; Wheel.locked = false; }
  Wheel.t = now;
  if (Wheel.locked) return; // fin d'élan du pavé tactile après un changement de page
  Wheel.acc += dx;
  if (Math.abs(Wheel.acc) > 90) {
    const dir = Wheel.acc > 0 ? 'next' : 'prev';
    Wheel.acc = 0; Wheel.locked = true;
    swipeTo(vp, dir);
  }
}, { passive: false });
document.addEventListener('touchend', endSwipe, { passive: true });
document.addEventListener('touchcancel', endSwipe, { passive: true });
// Un glisser ne doit jamais être pris pour un appui sur un lien ou un jour du calendrier
document.addEventListener('click', e => {
  if (performance.now() - Swipe.lastSwipe < 400 && e.target.closest('.swipe-vp')) { e.preventDefault(); e.stopPropagation(); }
}, true);

// ===== Détail d'une répète =====
const REH_SELECT = '*, availability(member,status), rehearsal_votes(member,vote), setlist_items(id,position,note,song_id,songs(title,cover_path,song_progress(member,level)))';

// Construit le contenu d'une fiche de répète (utilisé pour la page actuelle et ses voisines)
async function rehearsalHtml(r, songs, allReh) {

  const urlOf = await signedUrls(items.map(it => it.songs?.cover_path));
  const nextPos = items.length ? items[items.length - 1].position + 1 : 0;
  const mine = av.find(a => a.member === state.me);
  const idx = allReh.findIndex(x => x.id === r.id);
  const hasPrev = idx > 0, hasNext = idx >= 0 && idx < allReh.length - 1;

  const html = `

    </p>
    <div class="row between wrap">
      <div class="row wrap" style="gap:8px"><span class="muted">${esc([r.time, r.place].filter(Boolean).join(' · ') || 'Heure et lieu à préciser')}</span></div>
      <button class="btn-sm" data-act="toggle" data-target="editReh">Modifier</button>
    </div>
    ${stateHtml(r)}
    <form id="editReh" class="card hidden" data-form="editReh" data-id="${r.id}" style="margin-top:12px">
      <label>Date</label><input type="date" name="date" required value="${esc(r.date)}">
      <label>Heure</label><input type="time" name="time" value="${esc(r.time)}">
      <label>Lieu</label><input type="text" name="place" value="${esc(r.place)}">
      <div class="row" style="margin-top:14px">

        <button type="submit" class="btn-accent grow">Enregistrer</button>

async function viewRehearsal(id, $app = APP) {
  const [songs, allReh] = await Promise.all([
    q(db.from('songs').select('id,title').order('title')),
    q(db.from('rehearsals').select('id,date,time').order('date').order('time').order('created_at')),
  ]);
  const idx = allReh.findIndex(x => x.id === id);
  const prevId = idx > 0 ? allReh[idx - 1].id : '';
  const nextId = idx >= 0 && idx < allReh.length - 1 ? allReh[idx + 1].id : '';
  // On charge la répète et ses deux voisines d'un coup, pour les afficher pendant le glisser
  const recs = await q(db.from('rehearsals').select(REH_SELECT).in('id', [id, prevId, nextId].filter(Boolean)));
  const byId = Object.fromEntries(recs.map(x => [x.id, x]));
  const r = byId[id];
  if (!r) { $app.innerHTML = `<div class="empty">Cette répète n'existe plus.<br><br><a class="btn" href="#/repetes">Retour</a></div>`; return; }
  const [cur, prev, next] = await Promise.all([
    rehearsalHtml(r, songs, allReh),
    byId[prevId] ? rehearsalHtml(byId[prevId], songs, allReh) : null,
    byId[nextId] ? rehearsalHtml(byId[nextId], songs, allReh) : null,
  ]);
  state.availableSongs = cur.available.map(s => s.id);
  $app.innerHTML = swipeFrame('reh', prev ? prevId : '', next ? nextId : '', prev?.html, cur.html, next?.html);
  neutralizeSides(); // avant tout le reste : les voisines ne doivent garder aucun identifiant
  initSetlistSort();
}

// Aller à la répète précédente / suivante
function rehGo(id, dir) {
  if (!id) return;
  state.rehDir = dir;
  window.scrollTo(0, 0);
  go('#/repete/' + id);
  setTimeout(() => { state.rehDir = null; }, 600);
}

// Glisser-déposer de la setlist (poignée ☰)
function initSetlistSort() {
  const list = document.getElementById('setlist');
  if (!list || !window.Sortable) return;
  Sortable.create(list, {
    handle: '.drag-handle',
    animation: 150,
    delay: 0,
    fallbackTolerance: 3,
    onEnd: async evt => {
      if (evt.oldIndex === evt.newIndex) return;
      const ids = [...list.querySelectorAll('.set-item')].map(el => el.dataset.id);
      list.querySelectorAll('.set-num').forEach((el, i) => { el.textContent = i + 1; });
      lastLocalAction = Date.now();
      try {
        await Promise.all(ids.map((id, i) => q(db.from('setlist_items').update({ position: i }).eq('id', id))));
        toast('Ordre enregistré');
        lastLocalAction = Date.now();
        notifySetlist(currentRehId(), "a changé l'ordre de la setlist");
      } catch (e) { route(); }
    },
  });
}

// Ordre de navigation = ordre de l'onglet Morceaux (En cours, À apprendre, Prêt, puis titre)
async function viewSong(id, $app = APP) {
  const list = await q(db.from('songs').select('id,title,song_progress(member,level)').order('title'));
  const ordered = ['en-cours', 'a-apprendre', 'pret'].flatMap(g => list.filter(s => songStatus(s.song_progress) === g));
  const idx = ordered.findIndex(s => s.id === id);
  const prevId = idx > 0 ? ordered[idx - 1].id : '';
  const nextId = idx >= 0 && idx < ordered.length - 1 ? ordered[idx + 1].id : '';
  const [cur, prev, next] = await Promise.all([
    songHtml(id, !!prevId, !!nextId),
    prevId ? songHtml(prevId, idx - 1 > 0, true) : null,
    nextId ? songHtml(nextId, true, idx + 1 < ordered.length - 1) : null,
  ]);
  if (!cur) { $app.innerHTML = `<div class="empty">Ce morceau n'existe plus.<br><br><a class="btn" href="#/morceaux">Retour</a></div>`; return; }
  state.songQueue = cur.queue;
  $app.innerHTML = swipeFrame('song', prev ? prevId : '', next ? nextId : '', prev?.html, cur.html, next?.html);
  neutralizeSides(); // les voisines ne gardent aucun identifiant ni action
  Player.highlight();
}

// ===== Page d'écoute (les démos, la plus récente en haut) =====
const Listen = {
  heard: new Set(), open: new Set(),
  // Écoutée = 10 secondes jouées (ou jusqu'au bout pour une démo très courte)
  check() {
    const t = Player.queue[Player.i], a = Player.audio;
    if (!t || !t.audioId || this.heard.has(t.audioId) || !state.me) return;

// ===== Lecteur global (reste actif quand on change de page) =====
const Player = {
  queue: [], i: -1,
  audio: document.getElementById('plAudio'),
  el: id => document.getElementById(id),
  fmt(t) { if (!isFinite(t)) return '0:00'; t = Math.floor(t); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); },
  start(queue, i, noAutoplay) { this.queue = queue.slice(); this.play(i, noAutoplay); },
  play(i, noAutoplay) {
    if (i < 0 || i >= this.queue.length) return;
    this.i = i;
    const t = this.queue[i];
    this.audio.src = t.url;
    if (noAutoplay) { this.audio.load(); this.setIcon(); } else this.audio.play().catch(() => {});
    this.el('player').classList.remove('hidden');
    document.body.classList.add('playing');
    this.el('plTitle').textContent = t.title;
    this.el('plSub').textContent = t.audioTitle;
    const c = this.el('plCover');
    c.innerHTML = '';
    if (t.cover) { const img = document.createElement('img'); img.src = t.cover; img.alt = ''; c.appendChild(img); }
    else c.textContent = (t.title || '?').charAt(0).toUpperCase();
    this.el('plPrev').disabled = i === 0;
    this.el('plNext').disabled = i === this.queue.length - 1;
    this.highlight();
    Np.onTrack(); // nouveau morceau : tempo à 100 %, boucle effacée
    if ('mediaSession' in navigator && window.MediaMetadata) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.title, artist: state.band, album: t.audioTitle,
        artwork: t.cover ? [{ src: t.cover, sizes: '800x800', type: 'image/jpeg' }] : [],
      });
    }
  },
  toggle() { if (this.audio.paused) this.audio.play().catch(() => {}); else this.audio.pause(); },
  next() { if (this.i < this.queue.length - 1) this.play(this.i + 1); },
  prev() { if (this.audio.currentTime > 3) this.audio.currentTime = 0; else if (this.i > 0) this.play(this.i - 1); },
  stop() {
    Np.close();
    this.audio.pause(); this.audio.removeAttribute('src'); this.queue = []; this.i = -1;
    this.el('player').classList.add('hidden'); document.body.classList.remove('playing'); this.highlight();
  },
  highlight() {
    const cur = this.queue[this.i];
    document.querySelectorAll('.listen-row').forEach(r => r.classList.toggle('on', !!cur && r.dataset.song === cur.songId));
    document.querySelectorAll('[data-audio]').forEach(r => r.classList.toggle('on', !!cur && r.dataset.audio === cur.audioId));
  },
  setIcon() {
    const ico = this.audio.paused
      ? '<path d="M8 5v14l11-7z"/>'
      : '<rect x="6.5" y="5" width="3.5" height="14" rx="1"/><rect x="14" y="5" width="3.5" height="14" rx="1"/>';
    this.el('plPlayIco').innerHTML = ico;
    this.el('npPlayIco').innerHTML = ico;
    this.el('mkPlayIco').innerHTML = ico;
    this.el('fsPlayIco').innerHTML = ico;
    const label = this.audio.paused ? 'Lecture' : 'Pause';
    this.el('plPlay').setAttribute('aria-label', label);
    this.el('npPlay').setAttribute('aria-label', label);
    this.el('mkPlay').setAttribute('aria-label', label);
    this.el('fsPlay').setAttribute('aria-label', label);
  },
};
(() => {
  const a = Player.audio, seek = Player.el('plSeek');
  let dragging = false;
  Player.el('plPlay').addEventListener('click', () => Player.toggle());
  Player.el('plNext').addEventListener('click', () => Player.next());
  Player.el('plPrev').addEventListener('click', () => Player.prev());
  a.addEventListener('play', () => { Player.setIcon(); Np.startTick(); document.body.classList.remove('is-paused'); });
  a.addEventListener('pause', () => { Player.setIcon(); document.body.classList.add('is-paused'); });
  a.addEventListener('ended', () => {
    if (Np.loopOn()) { a.currentTime = Np.loop.a; a.play().catch(() => {}); return; } // boucle jusqu'à la fin du morceau
    if (Player.i < Player.queue.length - 1) Player.next(); else Player.setIcon();
  });
  a.addEventListener('loadedmetadata', () => { Player.el('plDur').textContent = Player.fmt(a.duration); Np.progress(); });
  a.addEventListener('timeupdate', () => {
    Np.checkLoop(); // filet de sécurité quand l'écran est éteint
    Listen.check();
    Player.el('plTime').textContent = Player.fmt(a.currentTime);
    if (!dragging && a.duration) seek.value = Math.round(a.currentTime / a.duration * 1000);
  });
  // Toucher le petit lecteur (hors boutons) ouvre la page « En lecture »
  Player.el('player').addEventListener('click', e => {
    if (e.target.closest('.pl-btn, #plSeek')) return;
    Np.open();
  });
  Player.el('plOpen').addEventListener('click', () => Np.open());
  a.addEventListener('error', () => { if (a.getAttribute('src')) toast('Impossible de lire cet enregistrement'); });
  seek.addEventListener('input', () => { dragging = true; if (a.duration) Player.el('plTime').textContent = Player.fmt(seek.value / 1000 * a.duration); });
  seek.addEventListener('change', () => { if (a.duration) a.currentTime = seek.value / 1000 * a.duration; dragging = false; });
  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', () => a.play());
      navigator.mediaSession.setActionHandler('pause', () => a.pause());
      navigator.mediaSession.setActionHandler('nexttrack', () => Player.next());
      navigator.mediaSession.setActionHandler('previoustrack', () => Player.prev());
    } catch (e) {}
  }
})();

// PDF.js (Mozilla), version « legacy » compatible avec les anciens navigateurs, chargée seulement si besoin
const PDFJS_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js';
const PDFJS_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js';
let pdfjsPromise = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (!pdfjsPromise) pdfjsPromise = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = PDFJS_URL;
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; res(window.pdfjsLib); };
    s.onerror = () => { pdfjsPromise = null; rej(new Error('Lecteur PDF indisponible')); };
    document.head.appendChild(s);
  });
  return pdfjsPromise;
}
const pdfCache = new Map();
async function getPdf(src) {
  if (!pdfCache.has(src)) {
    const p = loadPdfJs().then(lib => lib.getDocument(typeof src === 'string' ? { url: src } : { data: src }).promise);
    pdfCache.set(src, p);
    p.catch(() => pdfCache.delete(src));
  }
  return pdfCache.get(src);
}
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = crypto.getRandomValues(new Uint8Array(1))[0] & 15;
    return (c === 'x' ? r : (r & 3 | 8)).toString(16);
  });
}

// Affiche un document (texte, photo ou PDF) dans une boîte. La mise en page (hauteurs) est fixée
// avant le dessin des pages, pour que les positions des repères restent stables. zoom 1 = largeur de la boîte.
async function renderDoc(box, doc, zoom = 1) {
  const token = (box._token = (box._token || 0) + 1);
  box.innerHTML = '';
  const inner = document.createElement('div');
  inner.className = 'doc-inner';
  box.appendChild(inner);
  const cs = getComputedStyle(box);
  const inside = box.clientWidth - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
  const width = Math.max(200, Math.floor(inside) - 2) * zoom;
  if (doc.kind === 'text') {
    inner.innerHTML = `<pre class="mono doc-text" style="font-size:${Math.round(13 * zoom)}px">${esc(doc.text || '')}</pre>`;
    return;
  }
  if (doc.kind === 'image') {
    inner.innerHTML = `<img class="doc-img" alt="" style="width:${width}px">`;
    const img = inner.firstChild;
    await new Promise(r => { img.onload = r; img.onerror = r; img.src = doc.url; });
    return;
  }
  // PDF : on récupère la taille de chaque page, on réserve la place, puis on dessine
  inner.innerHTML = '<div class="muted small" style="padding:16px">Chargement du PDF…</div>';
  let pdf;
  try { pdf = await getPdf(doc.url); }
  catch (e) { inner.innerHTML = `<div class="empty">Impossible d'afficher ce PDF.<br><br><a class="btn btn-sm" href="${esc(doc.url)}" target="_blank" rel="noopener">Ouvrir le fichier</a></div>`; return; }
  if (box._token !== token) return;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) pages.push(await pdf.getPage(i));
  if (box._token !== token) return;
  inner.innerHTML = '';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const slots = pages.map(page => {
    const vp = page.getViewport({ scale: 1 });
    const scale = width / vp.width;
    const div = document.createElement('div');
    div.className = 'doc-page';
    div.style.width = width + 'px';
    div.style.height = Math.round(vp.height * scale) + 'px';
    inner.appendChild(div);
    return { page, div, scale };
  });
  // Dessin des pages l'une après l'autre (sans bloquer l'affichage)
  (async () => {
    for (const s of slots) {
      if (box._token !== token) return;
      const ratio = Math.min(dpr, 4096 / (s.div.clientWidth || 1));
      const vp = s.page.getViewport({ scale: s.scale * ratio });
      const canvas = document.createElement('canvas');
      canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
      s.div.appendChild(canvas);
      try { await s.page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise; } catch (e) {}
    }
  })();
}
// Position dans le document (0 = haut, 1 = bas), mesurée à la « ligne de lecture »
const READ_LINE = 0.3;
function docPos(box) { return box.scrollHeight ? Math.min(1, Math.max(0, (box.scrollTop + READ_LINE * box.clientHeight) / box.scrollHeight)) : 0; }
function setDocPos(box, p) { box.scrollTop = p * box.scrollHeight - READ_LINE * box.clientHeight; }

// ----- Visionneuse plein écran -----
const Dv = {
  isOpen: false, zoom: 1, doc: null,
  el: id => document.getElementById(id),
  open(doc) {
    this.doc = doc; this.zoom = 1; this.isOpen = true;
    this.el('dvTitle').textContent = doc.title || 'Tablature';
    this.el('dvDownload').href = doc.url;
    this.el('dv').classList.remove('hidden');
    document.body.classList.add('np-open');
    Layers.push('dv');
    this.render();
  },
  close(fromHistory) {
    if (!this.isOpen) return;
    this.isOpen = false;
    this.el('dv').classList.add('hidden');
    if (!Np.isOpen) document.body.classList.remove('np-open');
    this.el('dvBox').innerHTML = '';
    Layers.closed('dv', fromHistory);
  },
  async render() {
    const box = this.el('dvBox'), p = box.scrollHeight ? box.scrollTop / box.scrollHeight : 0;
    await renderDoc(box, this.doc, this.zoom);
    box.scrollTop = p * box.scrollHeight;
    this.el('dvZoom').textContent = Math.round(this.zoom * 100) + ' %';
    this.updatePage();
  },
  setZoom(z) { this.zoom = Math.min(4, Math.max(1, Math.round(z * 4) / 4)); this.render(); },
  updatePage() {
    const box = this.el('dvBox'), pages = [...box.querySelectorAll('.doc-page')];
    const ind = this.el('dvPage');
    if (!pages.length) { ind.textContent = ''; return; }
    const mid = box.scrollTop + box.clientHeight / 2;
    let n = 1;
    pages.forEach((pg, i) => { if (pg.offsetTop <= mid) n = i + 1; });
    ind.textContent = `Page ${n} / ${pages.length}`;
  },
};
(() => {
  const dv = Dv.el('dv');
  dv.addEventListener('click', e => {
    const b = e.target.closest('[data-dv]');
    if (!b) return;
    const v = b.dataset.dv;
    if (v === 'close') Dv.close();
    else if (v === 'zoom-') Dv.setZoom(Dv.zoom - 0.25);
    else if (v === 'zoom+') Dv.setZoom(Dv.zoom + 0.25);
    else if (v === 'fit') Dv.setZoom(1);
  });
  Dv.el('dvBox').addEventListener('scroll', () => Dv.updatePage(), { passive: true });
})();

// ===== Mode « Placer des repères » =====
// La tab en plein écran, les commandes en bas, et un toucher sur la tab place un repère à cet endroit.
const REACTION = 0.2; // on touche toujours un peu après avoir entendu : le repère est avancé d'autant
const Mk = {
  isOpen: false, placed: [], sel: null, down: null,
  el: id => document.getElementById(id),
  async open() {
    const doc = Np.doc(), t = Np.track();
    if (!doc || !t || !t.audioId) return;
    this.isOpen = true; this.placed = []; this.sel = null;
    this.el('mkDoc').textContent = doc.title;
    this.el('mk').classList.remove('hidden');
    Layers.push('mk');
    const box = this.el('mkBox');
    const npBox = Np.el('npDoc'), p = npBox ? docPos(npBox) : 0;
    await renderDoc(box, doc, Np.docZoom);
    setDocPos(box, p);
    this.renderMarks(); this.progress();
  },
  close(fromHistory) {
    if (!this.isOpen) return;
    this.isOpen = false;
    this.el('mk').classList.add('hidden');
    this.el('mkBox').innerHTML = '';
    Layers.closed('mk', fromHistory);
    Np.renderMarkers();
    Np.resumeFollow(); // la tab reprend son défilement, déjà synchronisée
  },
  // Marques des repères dans la marge gauche
  renderMarks() {
    const box = this.el('mkBox');
    box.querySelectorAll('.mk-mark').forEach(m => m.remove());
    const H = box.scrollHeight;
    Np.markers().forEach(m => {
      const div = document.createElement('div');
      div.className = 'mk-mark' + (this.sel === m.id ? ' sel' : '');
      div.style.top = (m.pos * H) + 'px';
      div.dataset.id = m.id;
      div.innerHTML = `<span class="mk-tag">${Player.fmt(m.t)}</span>
        ${this.sel === m.id ? `<button class="btn-sm mk-act" data-mk="go" data-id="${m.id}">Aller</button>
        <button class="btn-sm mk-act" data-mk="del" data-id="${m.id}" aria-label="Supprimer">✕</button>` : ''}`;
      box.appendChild(div);
    });
    const n = Np.markers().length;
    this.el('mkCount').textContent = `${n} repère${n > 1 ? 's' : ''}`;
    this.el('mkUndo').disabled = !this.placed.length;
  },
  progress() {
    if (!this.isOpen) return;
    const a = Player.audio;
    this.el('mkTime').textContent = `${Player.fmt(a.currentTime)} / ${Player.fmt(a.duration)}`;
  },
  async tapAt(clientY) {
    const box = this.el('mkBox'), a = Player.audio;
    const y = clientY - box.getBoundingClientRect().top - box.clientTop + box.scrollTop;
    const pos = y / box.scrollHeight;

    const ct = a.paused ? a.currentTime : Math.max(0, a.currentTime - REACTION * (a.playbackRate || 1));
    const row = await Np.addMarker(ct, pos);
    if (!row) return;
    this.placed.push(row.id);
    this.sel = null;
    this.renderMarks();

function notify(type, title, body, link, groupKey) {
  if (!state.me) return;

}
const short = (s, n = 90) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const rehWhen = r => r ? fmtDate(r.date, { weekday: 'long', day: 'numeric', month: 'short' }) : 'une répète';
async function rehSnapshot(id) {

  return data;
}
// Notifie l'ouverture du vote, ou une répète maintenue / annulée / rétablie
function notifyStatusChange(before, after) {
  if (!after) return;
  const b = before ? rehState(before).s : null;
  const st = rehState(after), a = st.s;
  if (a === b) return;
  const when = rehWhen(after), link = '#/repete/' + after.id, abs = st.absents.join(', ');
  if (a === 'vote') notify('vote_open', 'On répète quand même ?', `Il manque ${abs} pour ${when} : le vote est ouvert.`, link, 'status:' + after.id);
  else if (a === 'confirmee') notify('reh_status', 'On répète !', `Tout le monde est dispo : on répète ${when}${after.time ? ' à ' + after.time : ''}.`, link, 'status:' + after.id);
  else if (a === 'maintenue') notify('reh_status', 'Répète maintenue', `La répète du ${when} est maintenue${abs ? ' sans ' + abs : ''}.`, link, 'status:' + after.id);
  else if (a === 'annulee') notify('reh_status', 'Répète annulée', `La répète du ${when} est annulée (absent${st.absents.length > 1 ? 's' : ''} : ${abs}).`, link, 'status:' + after.id);
  else if (b === 'annulee') notify('reh_status', 'Répète rétablie', `La répète du ${when} n'est plus annulée.`, link, 'status:' + after.id);
}

// ----- Abonnement du téléphone aux notifications push -----
function b64uToU8(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('délai')), ms))]);
const Push = {
  supported: 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window,
  async reg() { return withTimeout(navigator.serviceWorker.ready, 4000); },
  async current() { try { return await (await Push.reg()).pushManager.getSubscription(); } catch (e) { return null; } },
  async save(sub) {
    const j = sub.toJSON();
    await q(db.from('push_subscriptions').upsert({ member: state.me, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth,
      user_agent: navigator.userAgent.slice(0, 200) }, { onConflict: 'endpoint' }));
  },
  async enable() {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Notifications refusées : autorise-les dans les réglages du téléphone'); return false; }
    const reg = await Push.reg();
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToU8(VAPID_PUBLIC) });
    await Push.save(sub);
    return true;
  },
  async disable() {
    const sub = await Push.current();
    if (!sub) return;
    await db.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
    try { await sub.unsubscribe(); } catch (e) {}
  },
  // Au démarrage et quand on change de nom : rattache ce téléphone au bon membre
  async sync() {
    if (!Push.supported || Notification.permission !== 'granted' || !state.me) return;
    const sub = await Push.current();
    if (sub) await Push.save(sub).catch(() => {});
  },
};
