// ----- Temps réel : la cloche et les pages se mettent à jour toutes seules -----
let rtChannel = null, rtTimer = null, lastLocalAction = 0;
async function startRealtime() {
  try {
    if (rtChannel) db.removeChannel(rtChannel);
    const { data } = await db.auth.getSession();
    if (data?.session && db.realtime?.setAuth) db.realtime.setAuth(data.session.access_token);
    rtChannel = db.channel('repetes-live')
      .on('postgres_changes', { event: '*', schema: 'public' }, onRealtime)
      .subscribe();
  } catch (e) {}
}
function stopRealtime() { if (rtChannel) { db.removeChannel(rtChannel); rtChannel = null; } }
function onRealtime(p) {
  if (p.table === 'audio_comments' || p.table === 'audio_comment_reactions') {
    if (Date.now() - lastLocalAction > 1500) Np.refreshComments();
    if (location.hash.startsWith('#/ecoute')) scheduleRefresh(); // compteurs 💬 de la liste
    return;
  }
  if (p.table === 'notifications') {
    const row = (p.new && Object.keys(p.new).length) ? p.new : p.old;
    if (!row || row.member !== state.me) return;
    updateBell();
    if (p.eventType === 'INSERT' && document.visibilityState === 'visible') toast(short(`${p.new.title} · ${p.new.body}`, 80));
    if (location.hash.startsWith('#/notifications')) scheduleRefresh();
    return;
  }
  if (['push_subscriptions', 'notif_prefs', 'reminder_log'].includes(p.table)) return;
  scheduleRefresh();
}
// Ne redessine pas la page si on est en train d'écrire, d'écouter ou de glisser
function busyEditing() {
  return Sheet.isOpen || (Swipe && Swipe.g) || document.querySelector('.swipe-vp[data-busy]')
    || document.querySelector('textarea:focus, input:focus, select:focus')
    || document.querySelector('#editReh:not(.hidden), [id^="edit-"]:not(.hidden), #audioChosen:not(.hidden)')
    || [...document.querySelectorAll('main audio')].some(a => !a.paused);
}
function scheduleRefresh() {
  clearTimeout(rtTimer);
  rtTimer = setTimeout(async () => {
    if (!state.authed || !state.me) return;
    if (busyEditing()) return scheduleRefresh();
    if (Date.now() - lastLocalAction < 1500) return; // notre propre changement est déjà affiché
    const y = window.scrollY;
    if (location.hash.startsWith('#/reglages')) return; // pas de rechargement pendant les réglages
    await route();
    window.scrollTo(0, y);
  }, 700);
}

    const id = el.dataset.id, before = await rehSnapshot(id);
    await q(db.from('rehearsal_votes').upsert(
      { rehearsal_id: id, member: state.me, vote: el.dataset.v, updated_at: new Date().toISOString() },
      { onConflict: 'rehearsal_id,member' }));
    route();
    const after = await rehSnapshot(id);
    const label = el.dataset.v === 'maintenir' ? 'On maintient' : 'On annule';
    notify('vote', 'Vote', `${state.me} vote « ${label} » pour ${rehWhen(after)}`, '#/repete/' + id, 'vote:' + id);
    notifyStatusChange(before, after);
  },
  // Écoute : toucher une démo la lance et ouvre « En lecture » (sans la relancer si elle joue déjà)
  lplay(el) {
    const id = el.dataset.audio, cur = Player.queue[Player.i];
    if (!(cur && cur.audioId === id)) {
      if (el.dataset.i != null) Player.start(state.listenQueue || [], Number(el.dataset.i));
      else if (state.listenAll && state.listenAll[id]) Player.start([state.listenAll[id]], 0);
      else return;
    }
    openNowPlaying();
  },
  lall() { if ((state.listenQueue || []).length) { Player.start(state.listenQueue, 0); openNowPlaying(); } },
  lvers(el) {
    const g = el.closest('.lgroup'), id = el.dataset.id;
    const open = !g.classList.contains('open');
    g.classList.toggle('open', open);
    el.setAttribute('aria-expanded', open);
    if (open) Listen.open.add(id); else Listen.open.delete(id);
  },
  playaudio(el) {
    const i = Number(el.dataset.i), q0 = state.songQueue || [];
    const cur = Player.queue[Player.i];
    // Toucher l'enregistrement déjà en cours : pause / reprise
    if (cur && q0[i] && cur.audioId === q0[i].audioId) { Player.toggle(); return; }
    Player.start(q0, i);
  },
  rehmode(el) {
    const f = document.getElementById('sheetForm');
    const series = el.dataset.mode === 'series';
    f.elements.mode.value = el.dataset.mode;
    f.querySelectorAll('[data-act=rehmode]').forEach(b => b.classList.toggle('on', b === el));
    document.getElementById('singleFields').classList.toggle('hidden', series);
    document.getElementById('seriesFields').classList.toggle('hidden', !series);
    if (series) updateSeriesPreview(); else updateSubmitLabel();
  },
  calnav(el) { calGo(el.dataset.ym, el.dataset.dir); },
  async level(el) {
    await q(db.from('song_progress').upsert(
      { song_id: el.dataset.id, member: state.me, level: el.dataset.l, updated_at: new Date().toISOString() },
      { onConflict: 'song_id,member' }));
    const song = document.getElementById('songTitle')?.textContent || '';
    route();
    notify('level', 'Progression', `${state.me} : ${LEVEL_BY_KEY[el.dataset.l].label} sur « ${song} »`, '#/morceau/' + el.dataset.id, 'level:' + el.dataset.id);
  },
  async savenotes(el) {
    const done = document.getElementById('doneNotes').value, todo = document.getElementById('todoNotes').value;
    await q(db.from('rehearsals').update({ done_notes: done, todo_notes: todo }).eq('id', el.dataset.id));
    toast('Bilan enregistré');

    const detail = done.trim() ? ` · Travaillé : ${short(done, 70)}` : todo.trim() ? ` · À bosser : ${short(todo, 70)}` : '';
    notify('bilan', 'Bilan de répète', `${state.me} a mis à jour le bilan du ${rehWhen(r)}${detail}`, '#/repete/' + el.dataset.id, 'bilan:' + el.dataset.id);
  },
  async delreh(el) {
    if (!confirm('Supprimer cette répète, ses dispos et sa setlist ?')) return;
    const r = await rehSnapshot(el.dataset.id);
    await q(db.from('rehearsals').delete().eq('id', el.dataset.id));
    go('#/repetes');
    notify('reh_delete', 'Répète supprimée', `${state.me} a supprimé la répète du ${rehWhen(r)}`, '#/repetes');
  },
  async savefield(el) {
    const f = el.dataset.field;
    const value = document.getElementById('ta-' + f).value;
    await q(db.from('songs').update({ [f]: value }).eq('id', el.dataset.id));
    toast('Enregistré');
    const song = document.getElementById('songTitle')?.textContent || '';
    route();
    const what = { tabs: ['Tabs modifiées', 'les tabs'], lyrics: ['Paroles modifiées', 'les paroles'], notes: ['Notes modifiées', 'les notes'] }[f] || ['Morceau modifié', f];
    notify('song_text', what[0], `${state.me} a modifié ${what[1]} de « ${song} »`, '#/morceau/' + el.dataset.id, `text:${el.dataset.id}:${f}`);
  },
  rename(el) { openRenameSheet('song', el.dataset.id, document.getElementById('songTitle').textContent); },
  // Marquer un morceau comme terminé : on choisit la version finale parmi ses enregistrements
  async freeze(el) {
    const id = el.dataset.id;
    const s = await q(db.from('songs').select('id,title,song_audio!song_audio_song_id_fkey(id,title,created_at,added_by)').eq('id', id).maybeSingle());
    if (!s) return;
    const recs = [...(s.song_audio || [])].sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
    Sheet.open('freeze', `
      <h2 style="margin:6px 0 6px">Marquer comme terminé</h2>
      <p class="muted small" style="margin:0 0 12px">« ${esc(s.title)} » sera figé : titre, BPM, pochette, paroles, notes, enregistrements et tablatures ne pourront plus être modifiés, jusqu'à ce que quelqu'un le rouvre. Le niveau de chacun, les notes perso et les commentaires restent libres.</p>
      <input type="hidden" name="id" value="${esc(id)}">
      <input type="hidden" name="title" value="${esc(s.title)}">
      ${recs.length ? `<label style="margin-top:0">Version finale</label>
        ${recs.map((a, i) => `<label class="check"><input type="radio" name="final" value="${a.id}" ${i === 0 ? 'checked' : ''}>
          <span class="grow">${esc(a.title || 'Sans titre')}<span class="muted small" style="display:block">${esc([a.added_by, fmtShort(a.created_at)].filter(Boolean).join(' · '))}</span></span></label>`).join('')}
        <label class="check"><input type="radio" name="final" value=""><span class="grow muted">Pas de version finale</span></label>`
      : `<p class="muted small">Ce morceau n'a pas encore d'enregistrement : pas de version finale.</p>`}`, `
      <button type="button" class="btn-ghost grow" data-act="closesheet">Annuler</button>
      <button type="submit" class="btn-accent grow">Terminer le morceau</button>`);
  },
  async unfreeze(el) {
    if (!confirm('Rouvrir ce morceau ? Il sera de nouveau modifiable par tout le monde.')) return;
    const id = el.dataset.id, title = document.getElementById('songTitle')?.textContent || '';
    lastLocalAction = Date.now();
    await q(db.from('songs').update({ frozen_at: null, frozen_by: null, final_audio_id: null }).eq('id', id));
    toast('Morceau rouvert');
    route();
    notify('song_text', 'Morceau rouvert', `${state.me} a rouvert « ${title} » : il est de nouveau modifiable`, '#/morceau/' + id, 'freeze:' + id);
  },
  renameaudio(el) { openRenameSheet('audio', el.dataset.id, el.dataset.title); },
  openfile(el) {
    const f = state.fileIndex[el.dataset.id];
    if (f) Dv.open({ id: f.id, kind: f.kind, title: f.title, url: f.url });
  },
  renamefile(el) { openRenameSheet('file', el.dataset.id, el.dataset.title); },
  async delfile(el) {
    if (!confirm(`Supprimer la tablature « ${el.dataset.title} » ? Ses repères de synchronisation seront aussi effacés.`)) return;
    const song = document.getElementById('songTitle')?.textContent || '';
    const songId = currentSongId() || '';

    await q(db.from('tab_markers').delete().eq('doc', el.dataset.id));
    await q(db.from('song_files').delete().eq('id', el.dataset.id));
    toast('Tablature supprimée');
    route();
    notify('song_text', 'Tablature supprimée', `${state.me} a supprimé la tablature « ${el.dataset.title} » de « ${song} »`, songId ? '#/morceau/' + songId : '#/morceaux');
  },
  async uploadaudio(el) {
    const input = document.getElementById('audioFile');
    const file = input?.files?.[0];
    if (!file) { toast('Choisis d\'abord un fichier audio'); return; }
    if (file.size > MAX_FILE) { toast(`Fichier trop lourd (${fmtSize(file.size)}). Maximum 50 Mo : exporte-le en MP3.`); return; }
    const title = document.getElementById('audioTitle').value.trim() || file.name.replace(/\.[^.]+$/, '');
    const ext = (file.name.split('.').pop() || 'audio').toLowerCase().replace(/[^a-z0-9]/g, '');
    const path = `audio/${el.dataset.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    el.textContent = 'Envoi en cours…';
    const { error } = await db.storage.from(MEDIA).upload(path, file, { contentType: audioType(file) });
    if (error) { el.textContent = 'Envoyer'; toast('Erreur : ' + error.message); return; }
    await q(db.from('song_audio').insert({ song_id: el.dataset.id, title, path, size: file.size, added_by: state.me }));
    toast('Enregistrement ajouté');
    const song = document.getElementById('songTitle')?.textContent || '';
    route();
    notify('audio', 'Nouvel enregistrement', `${state.me} a ajouté « ${title} » sur « ${song} »`, '#/morceau/' + el.dataset.id);
  },
  async delaudio(el) {
    if (!confirm('Supprimer cet enregistrement ?')) return;
    const song = document.getElementById('songTitle')?.textContent || '';
    const songId = currentSongId() || '';
    await db.storage.from(MEDIA).remove([el.dataset.path]);
    await q(db.from('song_audio').delete().eq('id', el.dataset.id));
    route();
    notify('audio', 'Enregistrement supprimé', `${state.me} a supprimé un enregistrement de « ${song} »`, songId ? '#/morceau/' + songId : '#/morceaux');
  },
  async delcover(el) {
    if (!confirm('Retirer la pochette ?')) return;

    await q(db.from('songs').update({ cover_path: null }).eq('id', el.dataset.id));
    const song = document.getElementById('songTitle')?.textContent || '';
    route();
    notify('cover', 'Pochette', `${state.me} a retiré la pochette de « ${song} »`, '#/morceau/' + el.dataset.id, 'cover:' + el.dataset.id);
  },
  async delsong(el) {
    if (!confirm('Supprimer ce morceau ? Il sera aussi retiré des setlists, avec ses enregistrements et sa pochette.')) return;
    const song = document.getElementById('songTitle')?.textContent || '';
    // Supprime d'abord les fichiers stockés (audio, tablatures, pochette)
    const s = await q(db.from('songs').select('cover_path, song_audio!song_audio_song_id_fkey(path), song_files(path)').eq('id', el.dataset.id).maybeSingle());
    const files = [s?.cover_path, ...((s?.song_audio || []).map(a => a.path)), ...((s?.song_files || []).map(f => f.path))].filter(Boolean);
    if (files.length) await db.storage.from(MEDIA).remove(files);

    notify('song_delete', 'Morceau supprimé', `${state.me} a supprimé « ${song} »`, '#/morceaux');
  },
  look(el) {
    Look.set(el.dataset.v);
    document.querySelectorAll('#lookSeg [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === el.dataset.v));

  async saveband() {
    const name = document.getElementById('bandInput').value.trim();
    if (!name) return;
    await q(db.from('settings').upsert({ id: 1, band_name: name }));
    await loadBase();
    toast('Nom du groupe enregistré');
    notify('group', 'Groupe', `${state.me} a renommé le groupe en « ${name} »`, '#/reglages', 'band');

  async logout() {
    if (!confirm('Se déconnecter ? Il faudra retaper le mot de passe du groupe.')) return;
    await Push.disable().catch(() => {}); // plus de notifications sur cet appareil
    stopRealtime();

    state.authed = false;
    viewLogin();

    if (!confirm(`Retirer ${n} du groupe ?`)) return;

    route();

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  e.preventDefault();
  const fn = actions[el.dataset.act];
  if (!fn || el.disabled) return;
  el.disabled = true;
  lastLocalAction = Date.now();
  try { await fn(el); } catch (err) {} finally { if (el.isConnected) el.disabled = false; lastLocalAction = Date.now(); }
});

// ===== Formulaires =====
document.addEventListener('submit', async e => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(form));
  const btn = form.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  lastLocalAction = Date.now();
  try {
    if (form.dataset.form === 'login') {
      const { error } = await db.auth.signInWithPassword({ email: GROUP_EMAIL, password: d.password });
      if (error) { toast('Mot de passe incorrect'); return; }
      state.authed = true;
      await start();
    } else if (form.dataset.form === 'newReh') {
      // Morceaux cochés (ordre alphabétique, comme affichés)
      const songIds = [...form.querySelectorAll('input[name=songs]:checked')].map(i => i.value);
      const place = (d.place || '').trim();
      let dates;
      if (d.mode === 'series') {
        dates = [...form.querySelectorAll('input[name=dates]:checked')].map(i => i.value);
        if (!dates.length) { toast('Aucune date cochée'); return; }
      } else {
        if (!d.date) { toast('Choisis une date'); return; }
        dates = [d.date];
      }
      const created = await q(db.from('rehearsals')
        .insert(dates.map(date => ({ date, time: d.time, place, created_by: state.me }))).select('id'));
      if (songIds.length) {
        await q(db.from('setlist_items').insert(created.flatMap(r =>
          songIds.map((song_id, i) => ({ rehearsal_id: r.id, song_id, position: i })))));
      }
      toast(`${created.length} répète${created.length > 1 ? 's créées' : ' créée'}${songIds.length ? ` avec ${songIds.length} morceau${songIds.length > 1 ? 'x' : ''}` : ''}`);
      if (state.sheetFrom === 'calendar') afterSheet(null);
      else afterSheet(created.length === 1 ? '#/repete/' + created[0].id : '#/repetes');
      const extra = `${d.time ? ' à ' + d.time : ''}${place ? ' · ' + place : ''}`;
      if (dates.length === 1) {
        notify('reh_new', 'Nouvelle répète', `${state.me} a ajouté une répète : ${rehWhen({ date: dates[0] })}${extra}`, '#/repete/' + created[0].id);
      } else {
        const sorted = [...dates].sort();
        notify('reh_new', 'Nouvelles répètes', `${state.me} a ajouté ${dates.length} répètes, du ${rehWhen({ date: sorted[0] })} au ${rehWhen({ date: sorted[sorted.length - 1] })}${extra}`, '#/calendrier/' + sorted[0].slice(0, 7));
      }
    } else if (form.dataset.form === 'editReh') {
      const before = await rehSnapshot(form.dataset.id);
      await q(db.from('rehearsals').update({ date: d.date, time: d.time, place: d.place.trim() }).eq('id', form.dataset.id));
      route();
      notify('reh_edit', 'Répète modifiée', `${state.me} a modifié la répète du ${rehWhen(before)} : ${rehWhen({ date: d.date })}${d.time ? ' à ' + d.time : ''}${d.place.trim() ? ' · ' + d.place.trim() : ''}`,
        '#/repete/' + form.dataset.id, 'edit:' + form.dataset.id);
    } else if (form.dataset.form === 'newSong') {
      const title = (d.title || '').trim();
      if (!title) { toast('Donne un titre au morceau'); return; }
      const s = await q(db.from('songs').insert({ title }).select('id').single());
      afterSheet('#/morceau/' + s.id);
      notify('song_new', 'Nouveau morceau', `${state.me} a ajouté « ${title} »`, '#/morceau/' + s.id);
    } else if (form.dataset.form === 'uploadFile') {
      const { file, songId } = state.pendingFile || {};
      const title = (d.title || '').trim() || 'Tablature';
      if (!file) { Sheet.close(); return; }
      const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
      btn.textContent = 'Envoi en cours…';
      let blob = file, pages = null, ext = 'pdf', type = 'application/pdf';
      if (isPdf) {
        // Nombre de pages (si le lecteur PDF est disponible)
        try { pages = (await getPdf(new Uint8Array(await file.arrayBuffer()))).numPages; } catch (e) {}
      } else {
        try { blob = await resizeImage(file, 2000); } catch (e) { toast('Cette image ne peut pas être lue'); btn.textContent = 'Envoyer'; return; }
        ext = 'jpg'; type = 'image/jpeg';
      }
      const path = `tabs/${songId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const { error } = await db.storage.from(MEDIA).upload(path, blob, { contentType: type });
      if (error) { toast('Erreur : ' + error.message); btn.textContent = 'Envoyer'; return; }
      await q(db.from('song_files').insert({ id: uuid(), song_id: songId, title, path, kind: isPdf ? 'pdf' : 'image', size: blob.size, pages, added_by: state.me }));
      state.pendingFile = null;
      toast('Tablature ajoutée');
      const song = document.getElementById('songTitle')?.textContent || '';
      afterSheet(null);
      notify('song_text', 'Nouvelle tablature', `${state.me} a ajouté la tablature « ${title} » (${isPdf ? 'PDF' : 'photo'}) à « ${song} »`, '#/morceau/' + songId, 'file:' + songId);
    } else if (form.dataset.form === 'freeze') {
      const final = d.final || null;
      await q(db.from('songs').update({ frozen_at: new Date().toISOString(), frozen_by: state.me, final_audio_id: final }).eq('id', d.id));
      const finTitle = final ? (form.querySelector(`input[name=final][value="${final}"]`)?.closest('label')?.querySelector('.grow')?.firstChild?.textContent || '').trim() : '';
      toast('Morceau terminé');
      afterSheet(null);
      notify('song_text', 'Morceau terminé', `${state.me} a marqué « ${d.title} » comme terminé${finTitle ? ` (version finale : ${finTitle})` : ''}`, '#/morceau/' + d.id, 'freeze:' + d.id);
    } else if (form.dataset.form === 'renameFile') {
      const title = (d.title || '').trim();
      if (!title) { toast('Le titre ne peut pas être vide'); return; }
      if (title === d.old) { Sheet.close(); return; }
      await q(db.from('song_files').update({ title }).eq('id', d.id));
      if (state.fileIndex[d.id]) state.fileIndex[d.id].title = title;
      toast('Tablature renommée');
      const song = document.getElementById('songTitle')?.textContent || '';
      const songId = currentSongId() || '';
      afterSheet(null);
      notify('song_text', 'Tablature renommée', `${state.me} a renommé une tablature de « ${song} » : « ${title} »`, songId ? '#/morceau/' + songId : '#/morceaux', 'renamefile:' + d.id);
    } else if (form.dataset.form === 'renameSong' || form.dataset.form === 'renameAudio') {
      const title = (d.title || '').trim();
      if (!title) { toast('Le titre ne peut pas être vide'); return; }
      if (title === d.old) { Sheet.close(); return; }
      const isSong = form.dataset.form === 'renameSong';
      const songId = isSong ? d.id : currentSongId();
      const song = document.getElementById('songTitle')?.textContent || '';
      await q(db.from(isSong ? 'songs' : 'song_audio').update({ title }).eq('id', d.id));
      // Le lecteur affiche tout de suite le nouveau titre
      [Player.queue, state.songQueue || [], state.listenQueue || []].forEach(list => list.forEach(t => {
        if (isSong ? t.songId === d.id : t.audioId === d.id) { if (isSong) t.title = title; else t.audioTitle = title; }
      }));
      const cur = Player.queue[Player.i];
      if (cur && (isSong ? cur.songId === d.id : cur.audioId === d.id)) {
        Player.el('plTitle').textContent = cur.title;
        Np.updateMiniSub();
        if (Np.isOpen) { Np.el('npTitle').textContent = cur.title; Np.el('npSub').textContent = cur.audioTitle || ''; }
      }
      toast(isSong ? 'Morceau renommé' : 'Enregistrement renommé');
      afterSheet(null);
      if (isSong) notify('song_text', 'Morceau renommé', `${state.me} a renommé « ${d.old} » en « ${title} »`, '#/morceau/' + d.id, 'rename:' + d.id);
      else notify('audio', 'Enregistrement renommé', `${state.me} a renommé un enregistrement de « ${song} » : « ${title} »`, songId ? '#/morceau/' + songId : '#/morceaux', 'renameaudio:' + d.id);
    } else if (form.dataset.form === 'newMember') {
      const name = d.name.trim();
      if (name) {
        await q(db.from('members').insert({ name })); await loadBase(); route();
        notify('group', 'Groupe', `${state.me} a ajouté ${name} au groupe`, '#/reglages');
      }
    }
  } catch (err) {} finally { if (btn && btn.isConnected) btn.disabled = false; lastLocalAction = Date.now(); }
});

// ===== Champs enregistrés automatiquement =====
document.addEventListener('change', async e => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  lastLocalAction = Date.now();
  try {
    if (el.dataset.change === 'itemnote') {
      await q(db.from('setlist_items').update({ note: el.value }).eq('id', el.dataset.id));
      toast('Note enregistrée');
      const song = el.closest('.set-item')?.querySelector('.title')?.textContent || '';
      const rid = currentRehId(), r = rid ? await rehSnapshot(rid) : null;
      if (el.value.trim()) notify('setlist_note', 'Note de répète', `${state.me} sur « ${song} » (${rehWhen(r)}) : ${short(el.value, 80)}`, rid ? '#/repete/' + rid : '', 'itemnote:' + el.dataset.id);
    } else if (el.dataset.change === 'tabfile') {
      const file = el.files?.[0];
      el.value = '';
      if (!file) return;
      const ok = file.type === 'application/pdf' || /\.pdf$/i.test(file.name) || /^image\//.test(file.type);
      if (!ok) { toast('Choisis un PDF ou une photo'); return; }
      if (file.size > MAX_FILE) { toast(`Fichier trop lourd (${fmtSize(file.size)}). Maximum 50 Mo.`); return; }
      openUploadFileSheet(file, el.dataset.song);
    } else if (el.dataset.change === 'bpm') {
      const raw = String(el.value).replace(',', '.').trim();
      const bpm = raw === '' ? null : Math.round(Number(raw) * 10) / 10;
      if (bpm !== null && (!isFinite(bpm) || bpm < 20 || bpm > 400)) { toast('Indique un tempo entre 20 et 400 BPM'); return; }
      await q(db.from('songs').update({ bpm }).eq('id', el.dataset.id));
      toast(bpm ? `Tempo enregistré : ${String(bpm).replace('.', ',')} BPM` : 'Tempo retiré');
      // Met à jour le lecteur si ce morceau est en cours
      Player.queue.forEach(t => { if (t.songId === el.dataset.id) t.bpm = bpm; });
      (state.songQueue || []).forEach(t => { t.bpm = bpm; });
      Np.renderTempo();
      const song = document.getElementById('songTitle')?.textContent || '';
      if (bpm) notify('song_text', 'Tempo du morceau', `${state.me} a indiqué le tempo de « ${song} » : ${String(bpm).replace('.', ',')} BPM`, '#/morceau/' + el.dataset.id, 'bpm:' + el.dataset.id);
    } else if (el.dataset.change === 'ntype') {
      const t = el.value, set = new Set(state.prefs.disabled_types);
      if (el.checked) set.delete(t); else set.add(t);
      state.prefs.disabled_types = [...set];
      await savePrefs();
    } else if (el.dataset.change === 'remday' || el.dataset.change === 'remtime') {
      const k = el.dataset.kind, i = Number(el.dataset.i);
      const slots = [...(state.prefs[k] || [])];
      if (!slots[i]) return;
      slots[i] = { ...slots[i], [el.dataset.change === 'remday' ? 'days' : 'time']: el.dataset.change === 'remday' ? Number(el.value) : (el.value || '18:00') };
      state.prefs[k] = slots;
      await savePrefs();
      toast('Rappel enregistré');
    } else if (el.dataset.change === 'audiofile') {
      const file = el.files?.[0];
      const pick = document.getElementById('audioPick');
      const chosen = document.getElementById('audioChosen');
      const title = document.getElementById('audioTitle');
      if (!file) return;
      if (file.size > MAX_FILE) {
        toast(`Fichier trop lourd (${fmtSize(file.size)}). Maximum 50 Mo : exporte-le en MP3.`);
        el.value = '';
        pick.classList.remove('hidden'); chosen.classList.add('hidden');
        return;
      }
      document.getElementById('audioChosenName').textContent = `${file.name} · ${fmtSize(file.size)}`;
      pick.classList.add('hidden'); chosen.classList.remove('hidden');
      // Titre prérempli avec le nom du fichier, sauf si l'utilisateur en a tapé un
      if (!title.value.trim() || title.dataset.auto === '1') {
        title.value = file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
        title.dataset.auto = '1';
      }
    } else if (el.dataset.change === 'cover') {
      const file = el.files?.[0];
      if (!file) return;
      toast('Envoi de la pochette…');
      let blob;
      try { blob = await resizeImage(file, 800); } catch (e) { toast('Cette image ne peut pas être lue'); return; }
      const path = `covers/${el.dataset.id}-${Date.now()}.jpg`;
      const { error } = await db.storage.from(MEDIA).upload(path, blob, { contentType: 'image/jpeg' });
      if (error) { toast('Erreur : ' + error.message); return; }
      if (el.dataset.old) await db.storage.from(MEDIA).remove([el.dataset.old]);
      await q(db.from('songs').update({ cover_path: path }).eq('id', el.dataset.id));
      toast('Pochette enregistrée');
      const song = document.getElementById('songTitle')?.textContent || '';
      route();
      notify('cover', 'Pochette', `${state.me} a ${el.dataset.old ? 'changé' : 'ajouté'} la pochette de « ${song} »`, '#/morceau/' + el.dataset.id, 'cover:' + el.dataset.id);
    } else if (el.dataset.change === 'mynote') {
      await q(db.from('song_progress').upsert(
        { song_id: el.dataset.id, member: state.me, note: el.value, updated_at: new Date().toISOString() },
        { onConflict: 'song_id,member' }));
      toast('Note enregistrée');
      const song = document.getElementById('songTitle')?.textContent || '';
      if (el.value.trim()) notify('perso_note', 'Note perso', `${state.me} sur « ${song} » : ${short(el.value, 80)}`, '#/morceau/' + el.dataset.id, 'perso:' + el.dataset.id);
    }
  } catch (err) {} finally { lastLocalAction = Date.now(); }
});

// ===== Aperçu de la série de répètes =====
['input', 'change'].forEach(evt => document.addEventListener(evt, e => {
  if (!e.target.closest('#sheetForm')) return;
  if (e.target.name === 'dates') updateSubmitLabel();
  else if (['weekday', 'start', 'end'].includes(e.target.name)) {
    // Si la date de début dépasse la fin, on repousse la fin de 2 mois
    const f = document.getElementById('sheetForm');
    if (e.target.name === 'start' && e.type === 'change' && f.elements.end.value < f.elements.start.value) f.elements.end.value = addMonths(f.elements.start.value, 2);
    updateSeriesPreview();
  }
}));

// ===== Recherche de morceaux =====
document.addEventListener('input', e => {
  if (e.target.id !== 'songSearch') return;
  const term = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.song-link').forEach(a => a.classList.toggle('hidden', !!term && !a.dataset.title.includes(term)));
});

// ===== Démarrage =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  // Appui sur une notification alors que l'app est déjà ouverte
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data?.type !== 'open') return;
    if (e.data.nid) markRead(e.data.nid);
    go(e.data.link || '#/notifications');
  });
}
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => {
  // Rafraîchit les données quand on revient sur l'app, sauf si un champ est en cours d'édition
  if (state.authed && document.visibilityState === 'visible') {
    updateBell();
    if (!busyEditing()) loadBase().then(route).catch(() => {});
  }
});
// Si la session expire ou est fermée, retour à l'écran de connexion
db.auth.onAuthStateChange(event => {
  if (event === 'SIGNED_OUT') { state.authed = false; viewLogin(); }
});
(async () => {
  const { data } = await db.auth.getSession();
  state.authed = !!data?.session;
  if (!state.authed) return viewLogin();
  start();
})();
</script>
</body>
</html>
