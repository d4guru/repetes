<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Répètes">
<title>Répètes</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1/Sortable.min.js"></script>
<style>
:root{
  --bg:#121214; --surface:#1c1c21; --surface2:#26262d; --border:#34343d;
  --text:#f2f2f4; --muted:#a6a6b0; --accent:#e8643a; --accent-text:#fff;
  --yes:#3fb96b; --maybe:#e3b341; --no:#e5534b;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
header.top{position:sticky;top:0;z-index:5;background:rgba(18,18,20,.94);backdrop-filter:blur(8px);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{margin:0;font-size:20px;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top .me{font-size:14px;color:var(--muted);white-space:nowrap}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--surface);
  border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{flex:1;text-align:center;padding:10px 4px 12px;font-size:13px;color:var(--muted)}
nav.bottom a .ico{display:block;width:24px;height:24px;margin:0 auto 3px;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom a.on{color:var(--accent);font-weight:600}
h2{font-size:22px;margin:4px 0 14px}
h3{font-size:15px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:26px 0 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.title{font-weight:650;font-size:18px}
.cap::first-letter{text-transform:uppercase}
button,.btn{font:inherit;font-size:16px;min-height:44px;padding:8px 16px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text);cursor:pointer}
button:active{transform:scale(.98)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.btn-ghost{background:transparent}
.btn-danger{background:transparent;border-color:var(--no);color:var(--no)}
.btn-sm{min-height:36px;padding:4px 12px;font-size:15px}
.btn-icon{min-width:44px;padding:0 10px}
.full{width:100%}
input,select,textarea{font:inherit;font-size:16px;width:100%;color:var(--text);background:var(--bg);
  border:1px solid var(--border);border-radius:11px;padding:11px 12px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}
.mono,textarea.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:14px;line-height:1.35}
pre.mono{white-space:pre;overflow-x:auto;margin:0;background:var(--bg);border:1px solid var(--border);
  border-radius:11px;padding:12px;-webkit-overflow-scrolling:touch}
pre.lyrics{white-space:pre-wrap;font-family:inherit;margin:0;background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:12px}
.vote{display:flex;gap:8px}
.vote button{flex:1;min-height:44px;padding:6px 4px;font-size:15px;background:var(--bg)}
.vote button.yes.on{background:var(--yes);border-color:var(--yes);color:#06210f;font-weight:700}
.vote button.maybe.on{background:var(--maybe);border-color:var(--maybe);color:#2a1f02;font-weight:700}
.vote button.no.on{background:var(--no);border-color:var(--no);color:#2a0705;font-weight:700}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.yes{background:rgba(63,185,107,.18);color:var(--yes)}
.chip.maybe{background:rgba(227,179,65,.18);color:var(--maybe)}
.chip.no{background:rgba(229,83,75,.18);color:var(--no)}
.chip.pret{background:rgba(63,185,107,.18);color:var(--yes)}
.chip.en-cours{background:rgba(227,179,65,.18);color:var(--maybe)}
.chip.a-apprendre{background:rgba(166,166,176,.15);color:var(--muted)}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.member-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.member-row:last-child{border-bottom:0}
.set-item{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px}
.set-num{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.set-item textarea{min-height:60px;margin-top:8px;font-size:15px}
.drag-handle{flex:none;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:22px;line-height:1;
  color:var(--muted);padding:8px 6px;margin:-8px 0 -8px -4px}
.sortable-ghost{opacity:.35}
.sortable-chosen{border-color:var(--accent)!important;box-shadow:0 6px 20px rgba(0,0,0,.5)}
details summary{cursor:pointer;color:var(--muted);padding:10px 0;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.back{display:inline-block;color:var(--muted);margin-bottom:8px;padding:6px 0}
.hidden{display:none!important}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:20;background:#2d2d35;color:var(--text);
  border:1px solid var(--border);border-radius:12px;padding:12px 14px;text-align:center;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:none}
.picker{max-width:420px;margin:40px auto 0;text-align:center}
.picker button{width:100%;margin-bottom:10px;font-size:18px;min-height:54px}
.loading{color:var(--muted);text-align:center;padding:40px 0}
.history-item{padding:10px 0;border-bottom:1px solid var(--border)}
.history-item:last-child{border-bottom:0}
:root{--l0:#6b6b75;--l1:#e3b341;--l2:#3fb96b;--l3:#4c9aff}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.dot{font-size:12px;font-weight:700;padding:2px 7px;border-radius:99px;border:1px solid transparent}
.dot.pas-commence{background:rgba(107,107,117,.2);color:#b8b8c2;border-color:#45454e}
.dot.apprentissage{background:rgba(227,179,65,.18);color:var(--l1)}
.dot.gere{background:rgba(63,185,107,.18);color:var(--l2)}
.dot.maitrise{background:rgba(76,154,255,.2);color:var(--l3)}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.levels button{min-height:48px;font-size:15px;background:var(--bg)}
.levels button.on.pas-commence{background:var(--l0);border-color:var(--l0);color:#fff;font-weight:700}
.levels button.on.apprentissage{background:var(--l1);border-color:var(--l1);color:#2a1f02;font-weight:700}
.levels button.on.gere{background:var(--l2);border-color:var(--l2);color:#06210f;font-weight:700}
.levels button.on.maitrise{background:var(--l3);border-color:var(--l3);color:#04172f;font-weight:700}
.prog-row{padding:10px 0;border-bottom:1px solid var(--border)}
.prog-row:last-child{border-bottom:0}
.seg{display:flex;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:transparent;min-height:40px}
.seg button.on{background:var(--surface2);color:var(--accent);font-weight:700}
label.check{display:flex;gap:12px;align-items:center;color:var(--text);font-size:16px;margin:0;padding:9px 0;border-bottom:1px solid var(--border)}
label.check:last-child{border-bottom:0}
label.check input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.alert{margin-top:8px;font-size:14px;font-weight:600;color:var(--maybe)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h2{margin:0;text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{text-align:center;font-size:12px;font-weight:700;padding-bottom:4px}
.cal-cell{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;
  border:1px solid transparent;font-size:15px;color:var(--muted)}
.cal-cell.has{font-weight:800;font-size:16px}
.cal-cell.today{outline:2px solid var(--text);outline-offset:-2px;color:var(--text)}
.cal-warn{position:absolute;top:1px;right:2px;font-size:11px}
.cal-more{position:absolute;bottom:1px;right:4px;font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
#calSwipe{touch-action:pan-y;overflow:hidden}
#rehSwipe{touch-action:pan-y}
body{overflow-x:clip}
@keyframes calFromRight{from{transform:translateX(40%);opacity:0}to{transform:none;opacity:1}}
@keyframes calFromLeft{from{transform:translateX(-40%);opacity:0}to{transform:none;opacity:1}}
.cal-in-next{animation:calFromRight .25s ease-out}
.cal-in-prev{animation:calFromLeft .25s ease-out}
@media (prefers-reduced-motion: reduce){.cal-in-next,.cal-in-prev{animation:none}}
</style>
</head>
<body>
<header class="top">
  <h1 id="bandName">…</h1>
  <a href="#/reglages" class="me" id="meLabel"></a>
</header>
<main id="app"><div class="loading">Chargement…</div></main>
<nav class="bottom" id="nav">
  <a href="#/repetes" data-tab="repetes">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>Répètes</a>
  <a href="#/calendrier" data-tab="calendrier">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendrier</a>
  <a href="#/morceaux" data-tab="morceaux">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5.5l11-2.5v12.5"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="15.5" r="2.5"/></svg>Morceaux</a>
  <a href="#/reglages" data-tab="reglages">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Réglages</a>
</nav>
<div id="toast"></div>

<script>
// ===== Configuration Supabase =====
const SB_URL = 'https://gdwwolgxivucqzdkvqfl.supabase.co';
const SB_KEY = 'sb_publishable_Wu-x56xJxZAzSJBj0UwDew_fcLMt6u1';
const db = supabase.createClient(SB_URL, SB_KEY);
// Compte unique du groupe (le mot de passe n'est PAS dans le code, chacun le tape à la connexion)
const GROUP_EMAIL = 'groupe@example.com';

// ===== Constantes =====
const VOTES = [
  { key: 'oui', label: 'Oui', cls: 'yes' },
  { key: 'peut-etre', label: 'Peut-être', cls: 'maybe' },
  { key: 'non', label: 'Non', cls: 'no' },
];
const VOTE_BY_KEY = Object.fromEntries(VOTES.map(v => [v.key, v]));
const SONG_STATUS = { 'a-apprendre': 'À apprendre', 'en-cours': 'En cours', 'pret': 'Prêt' };
const LEVELS = [
  { key: 'pas-commence', label: 'Pas commencé', icon: '⚪' },
  { key: 'apprentissage', label: 'En apprentissage', icon: '🟡' },
  { key: 'gere', label: 'Je gère', icon: '🟢' },
  { key: 'maitrise', label: 'Maîtrisé', icon: '🔵' },
];
const LEVEL_RANK = Object.fromEntries(LEVELS.map((l, i) => [l.key, i]));
const LEVEL_BY_KEY = Object.fromEntries(LEVELS.map(l => [l.key, l]));

// ===== Jours de la semaine et couleurs (index = getDay(), 0 = dimanche) =====
const DAYS = [
  { name: 'dimanche', short: 'Dim', color: '#e3c341' },
  { name: 'lundi', short: 'Lun', color: '#4c9aff' },
  { name: 'mardi', short: 'Mar', color: '#a371f7' },
  { name: 'mercredi', short: 'Mer', color: '#8a9bb8' },
  { name: 'jeudi', short: 'Jeu', color: '#2ec4b6' },
  { name: 'vendredi', short: 'Ven', color: '#f06292' },
  { name: 'samedi', short: 'Sam', color: '#3fb96b' },
];
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0]; // lundi en premier
const DEFAULT_WEEKDAY = 4;                 // jeudi
const DEFAULT_TIME = '20:00';
const ALERT_NON = 2;                       // alerte à partir de 2 « non »

function dateObj(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d, 12); }
function isoOf(dt) { return dt.toLocaleDateString('sv-SE'); }
function dayInfo(iso) { return DAYS[dateObj(iso).getDay()]; }
function dayChip(iso) {
  const d = dayInfo(iso);
  return `<span class="chip" style="background:${d.color}2e;color:${d.color}">${d.name}</span>`;
}
function nextWeekday(fromIso, wd) {
  const dt = dateObj(fromIso);
  dt.setDate(dt.getDate() + ((wd - dt.getDay() + 7) % 7));
  return isoOf(dt);
}
function noCount(av) { return (av || []).filter(a => a.status === 'non').length; }
function alertHtml(av) {
  const n = noCount(av);
  return n >= ALERT_NON ? `<div class="alert">⚠️ ${n} absents : peut-être changer de jour ?</div>` : '';
}

// Niveau d'un membre sur un morceau (pas d'entrée = pas commencé)
function levelOf(progress, member) {
  return (progress || []).find(p => p.member === member)?.level || 'pas-commence';
}
// Statut calculé : prêt si tout le monde gère au moins, en cours si quelqu'un a commencé
function songStatus(progress) {
  const ranks = state.members.map(m => LEVEL_RANK[levelOf(progress, m)]);
  if (ranks.length && ranks.every(r => r >= LEVEL_RANK.gere)) return 'pret';
  if (ranks.some(r => r >= LEVEL_RANK.apprentissage)) return 'en-cours';
  return 'a-apprendre';
}
// Pastilles colorées, une par membre
function dotsHtml(progress) {
  return `<div class="dots">${state.members.map(m => {
    const l = levelOf(progress, m);
    return `<span class="dot ${l}" title="${esc(m)} : ${LEVEL_BY_KEY[l].label}">${esc(m.slice(0, 3))}</span>`;
  }).join('')}</div>`;
}

const state = { band: 'Mon groupe', members: [], me: null, authed: false, existingDates: new Set() };
const $app = document.getElementById('app');

// ===== Utilitaires =====
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function getMe() { try { return localStorage.getItem('repetes_me'); } catch (e) { return null; } }
function setMe(v) { try { if (v) localStorage.setItem('repetes_me', v); else localStorage.removeItem('repetes_me'); } catch (e) {} state.me = v; }
function todayISO() { return new Date().toLocaleDateString('sv-SE'); }
function fmtDate(d, opts) {
  return new Date(d + 'T12:00:00').toLocaleDateString('fr-CH', opts || { weekday: 'long', day: 'numeric', month: 'long' });
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
async function q(builder) {
  const { data, error } = await builder;
  if (error) { console.error(error); toast('Erreur : ' + error.message); throw error; }
  return data;
}
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }

// ===== Chargement initial =====
async function loadBase() {
  const [settings, members] = await Promise.all([
    q(db.from('settings').select('band_name').eq('id', 1).maybeSingle()),
    q(db.from('members').select('name').order('id')),
  ]);
  state.band = settings?.band_name || 'Mon groupe';
  state.members = members.map(m => m.name);
  state.me = getMe();
  if (state.me && !state.members.includes(state.me)) setMe(null);
  document.getElementById('bandName').textContent = state.band;
  document.title = state.band + ' · Répètes';
  document.getElementById('meLabel').textContent = state.me ? '👤 ' + state.me : '';
}

// ===== Routage =====
async function route() {
  if (!state.authed) return viewLogin();
  document.getElementById('nav').classList.remove('hidden');
  const parts = (location.hash.replace(/^#\/?/, '') || 'repetes').split('/');
  const [view, id] = parts;
  document.querySelectorAll('#nav a').forEach(a => {
    const t = a.dataset.tab;
    a.classList.toggle('on', t === view || (t === 'repetes' && view === 'repete') || (t === 'morceaux' && view === 'morceau'));
  });
  if (!state.me) return viewPicker();
  try {
    if (view === 'repete' && id) await viewRehearsal(id);
    else if (view === 'morceaux') await viewSongs();
    else if (view === 'morceau' && id) await viewSong(id);
    else if (view === 'reglages') await viewSettings();
    else if (view === 'calendrier') await viewCalendar(id);
    else await viewRehearsals();
  } catch (e) {
    $app.innerHTML = `<div class="empty">Impossible de charger les données.<br><br><button onclick="route()">Réessayer</button></div>`;
  }
}

// ===== Connexion (mot de passe du groupe) =====
function viewLogin() {
  document.getElementById('nav').classList.add('hidden');
  document.getElementById('bandName').textContent = 'Répètes';
  document.getElementById('meLabel').textContent = '';
  $app.innerHTML = `
    <div class="picker">
      <img src="icon-192.png" alt="" style="width:88px;height:88px;border-radius:20px">
      <h2 style="margin-top:16px">Accès réservé au groupe</h2>
      <p class="muted">Entre le mot de passe du groupe. Il sera mémorisé sur ce téléphone.</p>
      <form data-form="login" style="text-align:left">
        <input type="password" name="password" required autocomplete="current-password" placeholder="Mot de passe du groupe">
        <button type="submit" class="btn-accent full" style="margin-top:12px">Entrer</button>
      </form>
    </div>`;
  setTimeout(() => $app.querySelector('input[name=password]')?.focus(), 50);
}

async function start() {
  try { await loadBase(); }
  catch (e) {
    $app.innerHTML = `<div class="empty">Connexion à la base impossible.<br>Vérifie ta connexion internet.<br><br><button onclick="location.reload()">Réessayer</button></div>`;
    return;
  }
  route();
}

// ===== Choix du membre =====
function viewPicker() {
  $app.innerHTML = `
    <div class="picker">
      <h2>Qui es-tu ?</h2>
      <p class="muted">Choisis ton nom. Il sera mémorisé sur ce téléphone.</p>
      ${state.members.map(m => `<button data-act="pick" data-name="${esc(m)}">${esc(m)}</button>`).join('')}
    </div>`;
}

// ===== Liste des répètes =====
function voteButtons(rid, current) {
  return `<div class="vote">${VOTES.map(v =>
    `<button class="${v.cls} ${current === v.key ? 'on' : ''}" data-act="vote" data-id="${rid}" data-s="${v.key}">${v.label}</button>`
  ).join('')}</div>`;
}
function countsHtml(av) {
  const c = { oui: 0, 'peut-etre': 0, non: 0 };
  av.forEach(a => { if (c[a.status] !== undefined) c[a.status]++; });
  const missing = state.members.filter(m => !av.some(a => a.member === m)).length;
  return `<div class="counts">
    <span class="chip yes">✓ ${c.oui}</span>
    <span class="chip maybe">? ${c['peut-etre']}</span>
    <span class="chip no">✗ ${c.non}</span>
    ${missing ? `<span class="chip">${missing} sans réponse</span>` : ''}
  </div>`;
}
function rehCard(r) {
  const mine = (r.availability || []).find(a => a.member === state.me);
  const col = dayInfo(r.date).color;
  return `<div class="card" style="border-left:5px solid ${col}">
    <a href="#/repete/${r.id}" style="display:block">
      <div class="row between" style="align-items:flex-start">
        <div class="grow">
          <div class="title cap"><span style="color:${col}">${esc(fmtDate(r.date, { weekday: 'long' }))}</span> ${esc(fmtDate(r.date, { day: 'numeric', month: 'long' }))}</div>
          <div class="muted small">${esc([r.time, r.place].filter(Boolean).join(' · ') || 'Heure et lieu à préciser')}</div>
        </div>

// ===== Série de répètes =====
function updateSeriesPreview() {
  const f = document.getElementById('newReh');
  if (!f) return;
  const wd = Number(f.elements.weekday.value);
  const start = f.elements.start.value || todayISO();
  const n = Math.min(52, Math.max(1, Number(f.elements.weeks.value) || 1));
  const first = dateObj(nextWeekday(start, wd));
  const dates = [];
  for (let i = 0; i < n; i++) { const dt = new Date(first); dt.setDate(first.getDate() + 7 * i); dates.push(isoOf(dt)); }
  document.getElementById('seriesPreview').innerHTML = dates.map(iso => {
    const exists = state.existingDates.has(iso);
    return `<label class="check"><input type="checkbox" name="dates" value="${iso}" ${exists ? '' : 'checked'}>
      <span class="cap">${esc(fmtDate(iso, { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' }))}</span>
      ${exists ? '<span class="muted small">(déjà prévue)</span>' : ''}</label>`;
  }).join('');
  updateSubmitLabel();
}
function updateSubmitLabel() {
  const f = document.getElementById('newReh');
  const b = document.getElementById('newRehSubmit');
  if (!f || !b) return;
  if (f.elements.mode.value === 'series') {
    const c = f.querySelectorAll('input[name=dates]:checked').length;
    b.textContent = `Créer ${c} répète${c > 1 ? 's' : ''}`;

}

// ===== Calendrier =====
async function viewCalendar(ym) {
  const today = todayISO();
  if (!/^\d{4}-\d{2}$/.test(ym || '')) ym = today.slice(0, 7);
  const [y, m] = ym.split('-').map(Number);
  const first = new Date(y, m - 1, 1, 12), last = new Date(y, m, 0, 12);
  const reh = await q(db.from('rehearsals').select('id,date,time,place,availability(status)')
    .gte('date', isoOf(first)).lte('date', isoOf(last)).order('date').order('time'));
  const byDate = {};
  reh.forEach(r => (byDate[r.date] = byDate[r.date] || []).push(r));
  const prev = isoOf(new Date(y, m - 2, 1, 12)).slice(0, 7);
  const next = isoOf(new Date(y, m, 1, 12)).slice(0, 7);
  const offset = (first.getDay() + 6) % 7; // semaine commençant le lundi

  let cells = WEEK_ORDER.map(i => `<div class="cal-dow" style="color:${DAYS[i].color}">${DAYS[i].short}</div>`).join('');
  for (let i = 0; i < offset; i++) cells += '<div></div>';
  for (let d = 1; d <= last.getDate(); d++) {
    const iso = `${ym}-${String(d).padStart(2, '0')}`;
    const list = byDate[iso];
    const todayCls = iso === today ? ' today' : '';
    if (list) {
      const c = dayInfo(iso).color;
      const warn = list.some(r => noCount(r.availability) >= ALERT_NON);
      cells += `<a class="cal-cell has${todayCls}" href="#/repete/${list[0].id}" style="background:${c}33;border-color:${c};color:${c}">${d}
        ${warn ? '<span class="cal-warn">⚠️</span>' : ''}${list.length > 1 ? `<span class="cal-more">×${list.length}</span>` : ''}</a>`;
    } else cells += `<div class="cal-cell${todayCls}">${d}</div>`;
  }

  $app.innerHTML = `
    <div class="cal-head">
      <button class="btn-icon" data-act="calnav" data-ym="${prev}" data-dir="prev" aria-label="Mois précédent">‹</button>
      <h2>${esc(first.toLocaleDateString('fr-CH', { month: 'long', year: 'numeric' }))}</h2>
      <button class="btn-icon" data-act="calnav" data-ym="${next}" data-dir="next" aria-label="Mois suivant">›</button>
    </div>
    <div id="calSwipe" data-prev="${prev}" data-next="${next}">
      <div class="cal-grid ${state.calDir ? 'cal-in-' + state.calDir : ''}">${cells}</div>
    </div>
    <p class="muted small" style="text-align:center;margin:8px 0 0">Glisse à gauche ou à droite pour changer de mois</p>
    ${ym !== today.slice(0, 7) ? `<button class="btn-sm full" style="margin-top:12px" data-act="calnav" data-ym="${today.slice(0, 7)}" data-dir="${ym > today.slice(0, 7) ? 'prev' : 'next'}">Revenir à aujourd'hui</button>` : ''}
    <div class="legend">${WEEK_ORDER.map(i => `<span class="chip" style="background:${DAYS[i].color}2e;color:${DAYS[i].color}">${DAYS[i].name}</span>`).join('')}</div>

    <h3>Répètes du mois (${reh.length})</h3>
    ${reh.length ? reh.map(r => {
      const c = dayInfo(r.date).color;
      return `<a class="card" style="display:block;border-left:5px solid ${c};padding:10px 14px" href="#/repete/${r.id}">
        <div class="row between"><span class="cap"><strong style="color:${c}">${esc(fmtDate(r.date, { weekday: 'long' }))}</strong> ${esc(fmtDate(r.date, { day: 'numeric', month: 'long' }))}</span>
        <span class="muted small">${esc(r.time || '')}</span></div>
        ${alertHtml(r.availability)}
      </a>`;
    }).join('') : '<div class="empty">Aucune répète ce mois-ci.</div>'}
  `;
}

// Changer de mois avec la direction de l'animation
function calGo(ym, dir) {
  state.calDir = dir || null;
  go('#/calendrier/' + ym);
  setTimeout(() => { state.calDir = null; }, 400);
}

// Glisser le doigt sur le calendrier pour changer de mois
let swipe = null;
document.addEventListener('touchstart', e => {
  const zone = e.target.closest('#calSwipe, #rehSwipe');
  // Pas de changement de page si le doigt part de la poignée ☰ ou d'un champ
  if (!zone || e.touches.length !== 1 || e.target.closest('.drag-handle, input, textarea, select')) { swipe = null; return; }
  swipe = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now(), zone };
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!swipe) return;
  const dx = e.changedTouches[0].clientX - swipe.x;
  const dy = e.changedTouches[0].clientY - swipe.y;
  const { zone, t } = swipe;
  swipe = null;
  // Geste nettement horizontal, assez long et assez rapide
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5 || Date.now() - t > 800) return;
  const dir = dx < 0 ? 'next' : 'prev';
  if (zone.id === 'rehSwipe') rehGo(zone.dataset[dir], dir);
  else calGo(zone.dataset[dir], dir);
}, { passive: true });

        </a>`).join('') : `<div class="muted small">Ce morceau n'a encore été dans aucune setlist.</div>`}
    </div>

    <button class="btn-danger full" style="margin-top:24px" data-act="delsong" data-id="${song.id}">Supprimer ce morceau</button>
  `;
}

// ===== Réglages =====
async function viewSettings() {
  await loadBase();
  $app.innerHTML = `
    <h2>Réglages</h2>
    <h3>Nom du groupe</h3>
    <div class="card">
      <input type="text" id="bandInput" value="${esc(state.band)}">
      <button class="btn-accent full" style="margin-top:10px" data-act="saveband">Enregistrer</button>
    </div>
    <h3>Moi</h3>
    <div class="card row between">
      <span>Tu es <strong>${esc(state.me)}</strong></span>
      <button class="btn-sm" data-act="changeme">Changer</button>
    </div>
    <h3>Connexion</h3>
    <div class="card row between">
      <span class="muted small">Connecté avec le mot de passe du groupe</span>
      <button class="btn-sm" data-act="logout">Se déconnecter</button>
    </div>
    <h3>Membres (${state.members.length})</h3>
    <div class="card">
      ${state.members.map(m => `<div class="member-row"><span>${esc(m)}</span>
        <button class="btn-sm btn-ghost" data-act="delmember" data-name="${esc(m)}" aria-label="Retirer ${esc(m)}">Retirer</button></div>`).join('')}
      <form class="row" style="margin-top:12px" data-form="newMember">
        <input type="text" name="name" required placeholder="Nouveau membre" class="grow">
        <button type="submit" class="btn-accent">Ajouter</button>
      </form>
    </div>
    <p class="muted small" style="margin-top:24px">Astuce : ajoute l'app à l'écran d'accueil de ton téléphone (menu Partager › « Sur l'écran d'accueil » sur iPhone, menu ⋮ › « Ajouter à l'écran d'accueil » sur Android).</p>
  `;
}

// ===== Actions (clics) =====
const actions = {
  async pick(el) { setMe(el.dataset.name); document.getElementById('meLabel').textContent = '👤 ' + state.me; route(); },
  toggle(el) {
    document.getElementById(el.dataset.target)?.classList.toggle('hidden');
    if (el.dataset.hide) document.getElementById(el.dataset.hide)?.classList.toggle('hidden');
  },
  async vote(el) {
    await q(db.from('availability').upsert(
      { rehearsal_id: el.dataset.id, member: state.me, status: el.dataset.s, updated_at: new Date().toISOString() },
      { onConflict: 'rehearsal_id,member' }));
    route();
  },
  async addset(el) {
    const sel = document.getElementById('addSong');
    if (!sel?.value) return;
    await q(db.from('setlist_items').insert({ rehearsal_id: el.dataset.id, song_id: sel.value, position: Number(el.dataset.next) }));
    route();
  },
  async unset(el) {
    await q(db.from('setlist_items').delete().eq('id', el.dataset.id));
    route();
  },
  async addall(el) {
    const ids = state.availableSongs || [];
    if (!ids.length) return;
    const start = Number(el.dataset.next);
    await q(db.from('setlist_items').insert(ids.map((song_id, i) => ({ rehearsal_id: el.dataset.id, song_id, position: start + i }))));
    toast(`${ids.length} morceau${ids.length > 1 ? 'x ajoutés' : ' ajouté'}`);
    route();
  },
  async clearset(el) {
    if (!confirm('Vider toute la setlist de cette répète ? Les notes par morceau de cette répète seront aussi effacées.')) return;
    await q(db.from('setlist_items').delete().eq('rehearsal_id', el.dataset.id));
    toast('Setlist vidée');
    route();
  },
  rehmode(el) {
    const f = document.getElementById('newReh');
    const series = el.dataset.mode === 'series';
    f.elements.mode.value = el.dataset.mode;
    f.querySelectorAll('[data-act=rehmode]').forEach(b => b.classList.toggle('on', b === el));
    document.getElementById('singleFields').classList.toggle('hidden', series);
    document.getElementById('seriesFields').classList.toggle('hidden', !series);
    if (series) updateSeriesPreview(); else updateSubmitLabel();
  },
  calnav(el) { calGo(el.dataset.ym, el.dataset.dir); },
  async level(el) {
    await q(db.from('song_progress').upsert(
      { song_id: el.dataset.id, member: state.me, level: el.dataset.l, updated_at: new Date().toISOString() },
      { onConflict: 'song_id,member' }));
    route();
  },
  async savenotes(el) {
    await q(db.from('rehearsals').update({
      done_notes: document.getElementById('doneNotes').value,
      todo_notes: document.getElementById('todoNotes').value,
    }).eq('id', el.dataset.id));
    toast('Bilan enregistré');
  },
  async delreh(el) {
    if (!confirm('Supprimer cette répète, ses dispos et sa setlist ?')) return;
    await q(db.from('rehearsals').delete().eq('id', el.dataset.id));
    go('#/repetes');
  },
  async savefield(el) {
    const f = el.dataset.field;
    await q(db.from('songs').update({ [f]: document.getElementById('ta-' + f).value }).eq('id', el.dataset.id));
    toast('Enregistré');
    route();
  },
  async rename(el) {
    const cur = document.getElementById('songTitle').textContent;
    const t = prompt('Nouveau titre', cur);
    if (!t || !t.trim() || t.trim() === cur) return;
    await q(db.from('songs').update({ title: t.trim() }).eq('id', el.dataset.id));
    route();
  },
  async delsong(el) {
    if (!confirm('Supprimer ce morceau ? Il sera aussi retiré des setlists.')) return;
    await q(db.from('songs').delete().eq('id', el.dataset.id));
    go('#/morceaux');
  },
  async saveband() {
    const name = document.getElementById('bandInput').value.trim();
    if (!name) return;
    await q(db.from('settings').upsert({ id: 1, band_name: name }));
    await loadBase();
    toast('Nom du groupe enregistré');
  },
  async logout() {
    if (!confirm('Se déconnecter ? Il faudra retaper le mot de passe du groupe.')) return;
    await db.auth.signOut();
    state.authed = false;
    viewLogin();
  },
  changeme() { setMe(null); document.getElementById('meLabel').textContent = ''; viewPicker(); },
  async delmember(el) {
    const n = el.dataset.name;
    if (!confirm(`Retirer ${n} du groupe ?`)) return;
    await q(db.from('members').delete().eq('name', n));
    if (n === state.me) setMe(null);
    await loadBase();
    route();
  },
};

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  e.preventDefault();
  const fn = actions[el.dataset.act];
  if (!fn || el.disabled) return;
  el.disabled = true;
  try { await fn(el); } catch (err) {} finally { if (el.isConnected) el.disabled = false; }
});

// ===== Formulaires =====
document.addEventListener('submit', async e => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(form));
  const btn = form.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  try {
    if (form.dataset.form === 'login') {
      const { error } = await db.auth.signInWithPassword({ email: GROUP_EMAIL, password: d.password });
      if (error) { toast('Mot de passe incorrect'); return; }
      state.authed = true;
      await start();
    } else if (form.dataset.form === 'newReh') {
      if (d.mode === 'series') {
        const dates = [...form.querySelectorAll('input[name=dates]:checked')].map(i => i.value);
        if (!dates.length) { toast('Aucune date cochée'); return; }
        await q(db.from('rehearsals').insert(dates.map(date => ({ date, time: d.time, place: d.place.trim(), created_by: state.me }))));
        toast(`${dates.length} répète${dates.length > 1 ? 's créées' : ' créée'}`);
        go('#/repetes');
      } else {
        if (!d.date) { toast('Choisis une date'); return; }
        const r = await q(db.from('rehearsals').insert({ date: d.date, time: d.time, place: d.place.trim(), created_by: state.me }).select('id').single());
        go('#/repete/' + r.id);
      }
    } else if (form.dataset.form === 'editReh') {
      await q(db.from('rehearsals').update({ date: d.date, time: d.time, place: d.place.trim() }).eq('id', form.dataset.id));
      route();
    } else if (form.dataset.form === 'newSong') {
      const s = await q(db.from('songs').insert({ title: d.title.trim() }).select('id').single());
      go('#/morceau/' + s.id);
    } else if (form.dataset.form === 'newMember') {
      const name = d.name.trim();
      if (name) { await q(db.from('members').insert({ name })); await loadBase(); route(); }
    }
  } catch (err) {} finally { if (btn && btn.isConnected) btn.disabled = false; }
});

// ===== Champs enregistrés automatiquement =====
document.addEventListener('change', async e => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  try {
    if (el.dataset.change === 'itemnote') {
      await q(db.from('setlist_items').update({ note: el.value }).eq('id', el.dataset.id));
      toast('Note enregistrée');
    } else if (el.dataset.change === 'mynote') {
      await q(db.from('song_progress').upsert(
        { song_id: el.dataset.id, member: state.me, note: el.value, updated_at: new Date().toISOString() },
        { onConflict: 'song_id,member' }));
      toast('Note enregistrée');
    }
  } catch (err) {}
});

// ===== Aperçu de la série de répètes =====
['input', 'change'].forEach(evt => document.addEventListener(evt, e => {
  if (!e.target.closest('#newReh')) return;
  if (e.target.name === 'dates') updateSubmitLabel();
  else if (['weekday', 'start', 'weeks'].includes(e.target.name)) updateSeriesPreview();
}));

// ===== Recherche de morceaux =====
document.addEventListener('input', e => {
  if (e.target.id !== 'songSearch') return;
  const term = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.song-link').forEach(a => a.classList.toggle('hidden', !!term && !a.dataset.title.includes(term)));
});

// ===== Démarrage =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => {
  // Rafraîchit les données quand on revient sur l'app, sauf si un champ est en cours d'édition
  if (state.authed && document.visibilityState === 'visible' && !document.querySelector('textarea:focus, input:focus')) loadBase().then(route).catch(() => {});
});
// Si la session expire ou est fermée, retour à l'écran de connexion
db.auth.onAuthStateChange(event => {
  if (event === 'SIGNED_OUT') { state.authed = false; viewLogin(); }
});
(async () => {
  const { data } = await db.auth.getSession();
  state.authed = !!data?.session;
  if (!state.authed) return viewLogin();
  start();
})();
</script>
</body>
</html>
